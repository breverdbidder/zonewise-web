version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "breverdbidder"
    groups:
      security-critical:
        patterns:
          - "next"
          - "@supabase/*"
          - "stripe"
          - "@anthropic-ai/*"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - "breverdbidder"
