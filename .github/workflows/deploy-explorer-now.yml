name: Deploy Explorer NOW
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
      VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --no-wait --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deploy URL: $DEPLOY_URL"
          echo "Waiting 30s for propagation..."
          sleep 30
          echo "Promoting to production..."
          vercel promote $DEPLOY_URL --token=${{ secrets.VERCEL_TOKEN }} --yes || true
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.zonewise.ai/explorer")
          echo "Explorer: HTTP $HTTP"
