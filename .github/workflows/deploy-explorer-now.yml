name: Deploy Explorer NOW
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Pull Vercel Config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_UEds2qBzyD9e7rOrX8aakj9K' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E' }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_UEds2qBzyD9e7rOrX8aakj9K' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E' }}

      - name: Deploy Prebuilt
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_UEds2qBzyD9e7rOrX8aakj9K' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E' }}
      
      - name: Verify
        run: |
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.zonewise.ai/explorer")
          echo "Explorer HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "🟢 EXPLORER IS LIVE!"
          else
            echo "🔴 Still $HTTP"
          fi
