name: Deploy Explorer NOW
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
      VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $URL"
          echo "DEPLOY_URL=$URL" >> $GITHUB_ENV
      
      - name: Verify Explorer
        run: |
          sleep 15
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.zonewise.ai/explorer")
          echo "Explorer HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "🟢 EXPLORER IS LIVE!"
          else
            echo "Checking deploy URL..."
            curl -s -o /dev/null -w "%{http_code}" "${{ env.DEPLOY_URL }}/explorer"
          fi
