name: Deploy Explorer NOW
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
      VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g vercel@latest
      - name: Check identity
        run: |
          echo "=== whoami ==="
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }}
          echo "=== teams ==="
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} 2>&1 || true
          echo "=== project ==="
          vercel inspect --token=${{ secrets.VERCEL_TOKEN }} 2>&1 || true
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy and alias
        run: |
          echo "Deploying (no --prod)..."
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "URL: $DEPLOY_URL"
          echo ""
          echo "Setting alias to production..."
          vercel alias set "$DEPLOY_URL" zonewise.ai --token=${{ secrets.VERCEL_TOKEN }} --scope=ariel-shapira-s-projects 2>&1 || true
          vercel alias set "$DEPLOY_URL" www.zonewise.ai --token=${{ secrets.VERCEL_TOKEN }} --scope=ariel-shapira-s-projects 2>&1 || true
          echo ""
          echo "Trying --prod deploy..."
          timeout 120 vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 || echo "Prod deploy timed out (expected)"
          echo ""
          sleep 10
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.zonewise.ai/explorer")
          echo "Explorer: HTTP $HTTP"
