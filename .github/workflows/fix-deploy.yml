name: Fix Deploy - Purge Cache & Verify

on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Get env var ID and update value
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PROJECT_ID="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "=== Debug: SERVICE_ROLE_KEY length ==="
          echo "Length: ${#SERVICE_ROLE_KEY}"
          echo "Prefix: ${SERVICE_ROLE_KEY:0:10}"
          
          echo "=== Getting env var ID ==="
          ENV_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env" | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for e in d.get('envs', []):
              if e['key'] == 'SUPABASE_SERVICE_ROLE_KEY':
                  print(e['id'])
                  break
          else:
              print('NOT_FOUND')
          ")
          
          echo "Env var ID: $ENV_ID"
          
          if [ "$ENV_ID" != "NOT_FOUND" ]; then
            echo "=== Patching value ==="
            curl -s -w "\nHTTP:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$ENV_ID" \
              -d "{\"value\":\"$SERVICE_ROLE_KEY\",\"target\":[\"production\",\"preview\",\"development\"],\"type\":\"encrypted\"}"
          else
            echo "Creating fresh..."
            curl -s -w "\nHTTP:%{http_code}" -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -d "{\"key\":\"SUPABASE_SERVICE_ROLE_KEY\",\"value\":\"$SERVICE_ROLE_KEY\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}"
          fi
