name: Fix Deploy - Purge Cache & Verify

on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Set SUPABASE_SERVICE_ROLE_KEY in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PROJECT_ID="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          echo "Setting SUPABASE_SERVICE_ROLE_KEY..."
          RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -d "{\"key\":\"SUPABASE_SERVICE_ROLE_KEY\",\"value\":\"$SERVICE_ROLE_KEY\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
          echo "$RESP"

      - name: Verify Vercel env vars
        run: |
          PROJECT_ID="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env" | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for e in d.get('envs', []):
              t = ','.join(e.get('target', []))
              print(f\"{e['key']}: {t}\")
          "
