name: Check Vercel Env
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: List env vars
        run: |
          vercel env ls --token=${{ secrets.VERCEL_TOKEN }} --scope=team_UEds2qBzyD9e7rOrX8aakj9K 2>&1 || true
          vercel env ls production --token=${{ secrets.VERCEL_TOKEN }} --scope=team_UEds2qBzyD9e7rOrX8aakj9K 2>&1 || true
        env:
          VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
          VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
