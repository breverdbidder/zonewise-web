name: vinext Deploy Fixed

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --legacy-peer-deps

      - name: Build
        run: |
          npm run build
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo "=== dist/server entry ==="
          ls -la dist/server/index.mjs

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log

      - name: Verify
        run: |
          sleep 8
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== / ==="
          curl -si --max-time 15 "$BASE/" | head -15
          echo "=== /api/health ==="
          curl -si --max-time 15 "$BASE/api/health"
