name: Deploy BidDeed.AI to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    name: Build & Deploy biddeed-ai-ui
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout biddeed-ai-ui
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/biddeed-ai-ui
          token: ${{ secrets.GH_TOKEN }}
          ref: main

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vY2VycWpua3NtaGNqenhyZXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1MzI1MjYsImV4cCI6MjA4MDEwODUyNn0.ySFJIOngWWB0aqYra4PoGFuqcbdHOx1ZV6T9-klKQDw
          NEXT_PUBLIC_APP_URL: https://biddeed-ai.pages.dev
          NEXT_PUBLIC_CHAT_API_URL: /api/chat
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.eyJ1IjoiZXZlcmVzdDE4IiwiYSI6ImNtanB5cDQ5ZzF1eWgzaHB2cGVhZXdqbjMifQ.4RPrkTf84GL1-clmhmCnTw
          NODE_ENV: production
        run: npm run build

      - name: Set CF Pages runtime env vars (ANTHROPIC_API_KEY + Supabase)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/biddeed-ai" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_configs\": {
                \"production\": {
                  \"env_vars\": {
                    \"ANTHROPIC_API_KEY\": {\"value\": \"${ANTHROPIC_API_KEY}\"},
                    \"SUPABASE_SERVICE_ROLE_KEY\": {\"value\": \"${SUPABASE_SERVICE_ROLE_KEY}\"}
                  }
                }
              }
            }" | python3 -c "import sys,json; d=json.load(sys.stdin); print('CF env vars:', 'OK' if d.get('success') else d.get('errors','?'))"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Create CF Pages project (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create biddeed-ai --production-branch=main 2>&1 || echo "Project exists"

      - name: Deploy to Cloudflare Pages (with Functions)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy out \
            --project-name=biddeed-ai \
            --branch=main \
            --commit-dirty=true 2>&1

      - name: Live URL
        run: echo "🚀 BidDeed.AI → https://biddeed-ai.pages.dev"
