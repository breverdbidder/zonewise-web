name: Sync Secrets to CLIProxy Gateway

on:
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PyNaCl
        run: pip install pynacl

      - name: Get cliproxy-gateway public key
        id: pubkey
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/breverdbidder/cliproxy-gateway/actions/secrets/public-key")
          echo "key=$(echo $RESPONSE | python3 -c 'import sys,json; print(json.load(sys.stdin)["key"])')" >> $GITHUB_OUTPUT
          echo "key_id=$(echo $RESPONSE | python3 -c 'import sys,json; print(json.load(sys.stdin)["key_id"])')" >> $GITHUB_OUTPUT
          echo "✅ Got public key"

      - name: Sync ANTHROPIC_API_KEY
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECRET_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_KEY: ${{ steps.pubkey.outputs.key }}
          KEY_ID: ${{ steps.pubkey.outputs.key_id }}
        run: |
          ENCRYPTED=$(python3 -c "
          from base64 import b64encode, b64decode
          from nacl.public import PublicKey, SealedBox
          import os
          pk = PublicKey(b64decode(os.environ['PUBLIC_KEY']))
          encrypted = SealedBox(pk).encrypt(os.environ['SECRET_VALUE'].encode())
          print(b64encode(encrypted).decode())
          ")
          curl -sf -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/breverdbidder/cliproxy-gateway/actions/secrets/ANTHROPIC_API_KEY" \
            -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}"
          echo "✅ ANTHROPIC_API_KEY synced"

      - name: Sync DEEPSEEK_API_KEY
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECRET_VALUE: ${{ secrets.DEEPSEEK_API_KEY }}
          PUBLIC_KEY: ${{ steps.pubkey.outputs.key }}
          KEY_ID: ${{ steps.pubkey.outputs.key_id }}
        run: |
          ENCRYPTED=$(python3 -c "
          from base64 import b64encode, b64decode
          from nacl.public import PublicKey, SealedBox
          import os
          pk = PublicKey(b64decode(os.environ['PUBLIC_KEY']))
          encrypted = SealedBox(pk).encrypt(os.environ['SECRET_VALUE'].encode())
          print(b64encode(encrypted).decode())
          ")
          curl -sf -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/breverdbidder/cliproxy-gateway/actions/secrets/DEEPSEEK_API_KEY" \
            -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}"
          echo "✅ DEEPSEEK_API_KEY synced"

      - name: Trigger gateway deploy
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/breverdbidder/cliproxy-gateway/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "✅ Deploy triggered"
