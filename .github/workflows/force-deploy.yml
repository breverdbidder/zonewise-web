name: Force Vercel Deploy
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Pull and Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --token=$VERCEL_TOKEN --environment=production 2>&1 | tail -5
          vercel build --prod --token=$VERCEL_TOKEN 2>&1 | tail -30
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tail -10
