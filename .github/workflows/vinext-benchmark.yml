name: vinext Benchmark + Deploy

on:
  workflow_dispatch:

jobs:
  benchmark-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check vinext + vite
        run: |
          node --version
          node -e "const p=require('./node_modules/vinext/package.json'); console.log('vinext:', p.version, '| engines:', JSON.stringify(p.engines))"
          node -e "const p=require('./node_modules/vite/package.json'); console.log('vite:', p.version)"
          ls node_modules/.bin/ | grep -E "vinext|vite"

      - name: Benchmark - next build (baseline)
        id: next_bench
        run: |
          START_MS=$(date +%s%3N)
          npm run next:build 2>&1 | tee /tmp/next_build.log
          END_MS=$(date +%s%3N)
          ELAPSED=$(( END_MS - START_MS ))
          echo "next_ms=$ELAPSED" >> $GITHUB_OUTPUT
          BUNDLE_SIZE=$(du -sh .next 2>/dev/null | cut -f1 || echo "N/A")
          echo "next_bundle=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
          echo "NEXT BUILD: ${ELAPSED}ms | bundle: $BUNDLE_SIZE"
          rm -rf .next

      - name: Benchmark - vinext build
        id: vinext_bench
        continue-on-error: true
        run: |
          START_MS=$(date +%s%3N)
          npm run build 2>&1 | tee /tmp/vinext_build.log
          BUILD_EXIT=$?
          END_MS=$(date +%s%3N)
          ELAPSED=$(( END_MS - START_MS ))
          echo "vinext_ms=$ELAPSED" >> $GITHUB_OUTPUT
          echo "vinext_exit=$BUILD_EXIT" >> $GITHUB_OUTPUT
          echo "VINEXT BUILD: ${ELAPSED}ms exit=$BUILD_EXIT"
          for d in dist .vinext .output; do
            if [ -d "$d" ]; then
              SIZE=$(du -sh $d | cut -f1)
              echo "vinext_bundle=$SIZE" >> $GITHUB_OUTPUT
              echo "Bundle: $d = $SIZE"
              break
            fi
          done
          cat /tmp/vinext_build.log | tail -50

      - name: Calculate speedup
        run: |
          python3 -c "
          next_ms = ${{ steps.next_bench.outputs.next_ms }}
          vinext_ms = ${{ steps.vinext_bench.outputs.vinext_ms }}
          if vinext_ms > 0 and next_ms > 0:
              ratio = next_ms / vinext_ms
              saved = ((next_ms - vinext_ms) / next_ms) * 100
              print(f'SPEEDUP: {ratio:.1f}x faster ({saved:.0f}% time saved)')
              print(f'next: {next_ms/1000:.2f}s | vinext: {vinext_ms/1000:.2f}s')
          "

      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log | tail -30
          DEPLOYED_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev[^ ]*' /tmp/deploy.log | head -1 || echo "")
          echo "deployed_url=$DEPLOYED_URL" >> $GITHUB_OUTPUT
          echo "DEPLOYED URL: $DEPLOYED_URL"
          if [ -n "$DEPLOYED_URL" ]; then
            sleep 8
            curl -sf --max-time 30 "$DEPLOYED_URL/api/health" | python3 -m json.tool && echo "HEALTH OK" || echo "health pending"
          fi

      - name: Log to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - << 'PYEOF2'
          import urllib.request, json, os, datetime
          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_KEY", "")
          payload = {
              "category": "vinext_benchmark",
              "title": "vinext vs next.js " + str(datetime.date.today()),
              "content": json.dumps({
                  "next_build_ms": "${{ steps.next_bench.outputs.next_ms }}",
                  "vinext_build_ms": "${{ steps.vinext_bench.outputs.vinext_ms }}",
                  "next_bundle": "${{ steps.next_bench.outputs.next_bundle }}",
                  "vinext_bundle": "${{ steps.vinext_bench.outputs.vinext_bundle }}",
                  "deployed_url": "${{ steps.deploy.outputs.deployed_url }}",
                  "vinext_version": "0.0.9",
                  "node_version": "22",
                  "test_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              }),
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          req = urllib.request.Request(
              f"{url}/rest/v1/insights",
              data=json.dumps(payload).encode(),
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json", "Prefer": "return=minimal"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Supabase: HTTP {r.status}")
          except Exception as e:
              print(f"Supabase error: {e}")
          PYEOF2

      - name: Final Report
        run: |
          echo ""
          echo "========================================"
          echo "  VINEXT BENCHMARK RESULTS"
          echo "========================================"
          echo "  next build:     ${{ steps.next_bench.outputs.next_ms }}ms"
          echo "  vinext build:   ${{ steps.vinext_bench.outputs.vinext_ms }}ms"
          echo "  next bundle:    ${{ steps.next_bench.outputs.next_bundle }}"
          echo "  vinext bundle:  ${{ steps.vinext_bench.outputs.vinext_bundle }}"
          echo "  deployed:       ${{ steps.deploy.outputs.deployed_url }}"
          echo "========================================"
