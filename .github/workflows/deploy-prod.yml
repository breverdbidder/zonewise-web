# DEPRECATED (issue #20026, Vercel -> Cloudflare exit): this workflow deploys
# to Vercel, which is being retired as the production platform for
# zonewise.ai in favor of a Cloudflare Worker (see
# .github/workflows/cloudflare-production.yml). The push-to-main trigger has
# been removed so this can no longer fire automatically and race the
# Cloudflare deploy; it is kept as workflow_dispatch-only for manual rollback
# to Vercel if the Cloudflare cutover needs to be reversed. Do not re-add the
# push trigger without also resolving which platform is authoritative for
# zonewise.ai DNS.
name: Deploy to Vercel Production
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull + Build
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
          VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Deploy (prebuilt)
        id: deploy
        run: |
          # Use shell timeout so step exits cleanly if deploy hangs (Force Alias handles it)
          timeout 8m vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} > /tmp/deploy_out.txt 2>&1 || true
          cat /tmp/deploy_out.txt
          DEPLOY_URL=$(grep -oE 'https://[a-z0-9._-]+\.vercel\.app' /tmp/deploy_out.txt | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
          VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E

      - name: Force Alias (if deploy URL missing)
        if: steps.deploy.outputs.url == ''
        run: |  # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- curl output piped to python3/jq for JSON parsing only, never executed as shell (verified noise, recon #18878)
          echo "Deploy URL missing — finding latest READY deployment via API"
          # Wait up to 5min for the deployment to become READY
          for i in $(seq 1 10); do
            READY_URL=$(curl -s "https://api.vercel.com/v6/deployments?projectId=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E&limit=5&target=production" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | python3 -c "
          import json,sys
          for d in json.load(sys.stdin).get('deployments',[]):
              if d.get('readyState') == 'READY':
                  print('https://' + d['url'])
                  break
          ")
            if [ -n "$READY_URL" ]; then
              echo "Aliasing: $READY_URL"
              vercel alias set "$READY_URL" zonewise.ai --token=${{ secrets.VERCEL_TOKEN }} --scope=team_UEds2qBzyD9e7rOrX8aakj9K
              echo "✅ Aliased via Force Alias"
              break
            fi
            echo "Attempt $i: no READY deployment yet, waiting 30s..."
            sleep 30
          done
        env:
          VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
          VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E

      - name: Alias to zonewise.ai
        if: steps.deploy.outputs.url != ''
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" zonewise.ai --token=${{ secrets.VERCEL_TOKEN }} --scope=team_UEds2qBzyD9e7rOrX8aakj9K
          echo "✅ zonewise.ai aliased"

      - name: Smoke Test
        if: always()
        run: |
          sleep 15
          for page in "" explorer chat dashboard conquest; do
            HTTP=$(curl -sL -o /dev/null -w "%{http_code}" "https://zonewise.ai/$page")
            echo "/$page: HTTP $HTTP"
          done
          API_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://zonewise.ai/api/zoning-chat" \
            -H "Content-Type: application/json" -d '{"message":"test"}')
          echo "/api/zoning-chat: HTTP $API_HTTP"

      - name: "Auto-Verify: Trigger Playwright on Hetzner"
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST             -H "Authorization: token $GH_PAT"             -H "Accept: application/vnd.github.v3+json"             -H "Content-Type: application/json"             -d '{"ref":"main","inputs":{"url":"https://zonewise.ai/chat-v2","selectors":".aui-root,.aui-composer-input,[class*=grid]","max_attempts":"5"}}'             "https://api.github.com/repos/breverdbidder/cli-anything-biddeed/actions/workflows/playwright-verify.yml/dispatches"             && echo "✅ Playwright verify triggered on Hetzner"             || echo "⚠️ Playwright verify dispatch failed (non-blocking)"
