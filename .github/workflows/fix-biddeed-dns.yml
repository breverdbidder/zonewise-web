name: Fix BidDeed DNS — biddeed.ai + ops.biddeed.ai

on:
  workflow_dispatch: {}

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    env:
      ZW_ZONE: b32406b78aaaefd55557d77c843a5940
      BD_ZONE: dcb6876f057e0bb88be181d6e8d0dcbc
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HETZNER_IP: "87.99.129.125"
    steps:
      - name: Fix biddeed.ai DNS
        run: |
          set -e
          echo "=== Current biddeed.ai records ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$BD_ZONE/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              for r in d['result']:
                  print(f'  {r["type"]} {r["name"]} -> {r["content"]} (id={r["id"]})')
              if not d['result']: print('  EMPTY')
          else:
              print(f'  AUTH ERROR: {d.get("errors",[])}')"

          echo ""
          echo "=== Adding biddeed.ai CNAME -> cname.vercel-dns.com ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$BD_ZONE/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"biddeed.ai","content":"cname.vercel-dns.com","proxied":false,"ttl":1}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print(f'  OK: {d["result"]["name"]} -> {d["result"]["content"]}')
          else:
              print(f'  FAIL: {d.get("errors",[])}')"

          echo ""
          echo "=== Adding www.biddeed.ai CNAME -> cname.vercel-dns.com ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$BD_ZONE/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"www","content":"cname.vercel-dns.com","proxied":false,"ttl":1}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print(f'  OK: {d["result"]["name"]} -> {d["result"]["content"]}')
          else:
              print(f'  FAIL: {d.get("errors",[])}')"

      - name: Fix ops.biddeed.ai DNS
        run: |
          echo "=== Adding ops.biddeed.ai A -> Hetzner ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$BD_ZONE/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"A","name":"ops","content":"'"$HETZNER_IP"'","proxied":true,"ttl":1}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print(f'  OK: {d["result"]["name"]} -> {d["result"]["content"]}')
          else:
              print(f'  FAIL: {d.get("errors",[])}')"

      - name: Verify DNS propagation
        run: |
          echo "Waiting 15s for propagation..."
          sleep 15
          
          echo "=== All biddeed.ai records ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$BD_ZONE/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('result',[]):
              print(f'  {r["type"]:6s} {r["name"]:30s} -> {r["content"]}')"
          
          echo ""
          echo "=== Curl tests ==="
          for url in "https://biddeed.ai" "https://ops.biddeed.ai"; do
            CODE=\$(curl -sI -o /dev/null -w "%{http_code}" "\$url" --connect-timeout 10 2>/dev/null || echo "000")
            echo "  \$url -> HTTP \$CODE"
          done
