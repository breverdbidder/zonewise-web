name: Set Vercel Env
on:
  workflow_dispatch:
jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Create env var via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PROJECT_ID="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "Setting SUPABASE_SERVICE_ROLE_KEY..."
          RESP=$(curl -s -w "
HTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
            -d "{\"key\":\"SUPABASE_SERVICE_ROLE_KEY\",\"value\":\"$SERVICE_ROLE_KEY\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
          
          echo "$RESP"
