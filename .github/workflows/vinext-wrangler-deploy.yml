name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Step 1 - vinext build (RSC + SSR bundles)
        run: npm run build

      - name: Step 2 - Generate worker/index.ts + vite.config.ts via vinext deploy (dry run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # vinext deploy generates the files then fails on wrangler.toml main pointing to
          # dist/worker-bundle.mjs which doesn't exist yet. We capture the generated files.
          # Reset wrangler.toml to default so vinext deploy doesn't choke on our custom main
          printf 'name = "zonewise-vinext-test"\ncompatibility_date = "2024-09-23"\ncompatibility_flags = ["nodejs_compat_v2"]\n\n[vars]\nENVIRONMENT = "test"\n' > wrangler.toml
          
          npm run deploy 2>&1 | head -30 || true
          
          echo "=== Generated files? ==="
          ls worker/ 2>/dev/null && cat worker/index.ts || echo "no worker/"
          ls vite.config.ts 2>/dev/null && cat vite.config.ts || echo "no vite.config.ts"

      - name: Step 3 - Run vite build with generated config (resolves virtual:vinext-rsc-entry)
        run: |
          npx vite build 2>&1
          echo "=== All new files after vite build ==="
          find . -newer wrangler.toml -not -path "*/node_modules/*" -not -path "*/.git/*" -type f 2>/dev/null | grep -v "node_modules" | sort | head -30
          echo ""
          echo "=== dist/ after vite build ==="
          find dist -type f | sort

      - name: Step 4 - Find Worker bundle and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== .wrangler/ ==="
          find .wrangler -type f 2>/dev/null | head -20
          for f in $(find .wrangler -type f 2>/dev/null); do echo "--- $f ---"; cat "$f" | head -20; done
          
          # Look for wrangler.json that vinext vite build generates
          echo "=== Any wrangler.json? ==="
          find . -name "wrangler.json" -not -path "*/node_modules/*" 2>/dev/null
          
          # Use vinext deploy again — this time vite.config.ts + worker/index.ts exist
          # and the vinext app bundle is in dist/
          npm run deploy 2>&1

      - name: Verify live
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          for path in "/" "/api/health" "/county"; do
            echo "--- $path ---"
            curl -si --max-time 20 "$BASE$path" | head -6
            echo ""
          done
