name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Inspect dist/server/index.mjs exports
        run: |
          npm run build 2>&1 | tail -5
          echo "=== Last 40 lines of dist/server/index.mjs (exports) ==="
          tail -40 dist/server/index.mjs
          echo ""
          echo "=== dist/server/ssr/index.mjs last 30 lines ==="
          tail -30 dist/server/ssr/index.mjs

      - name: Run vinext deploy and capture ALL generated files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy 2>&1 | tee /tmp/deploy.log || true
          echo "=== ALL files generated by vinext deploy ==="
          find . -newer package.json -not -path "*/node_modules/*" -not -path "*/.git/*" -type f 2>/dev/null | sort
          echo ""
          echo "=== .wrangler/ contents ==="
          find .wrangler -type f 2>/dev/null | head -20
          echo ""
          echo "=== worker/ dir ==="
          ls -la worker/ 2>/dev/null && cat worker/index.ts 2>/dev/null || echo "no worker/"
          echo ""
          echo "=== vite.config.ts ==="
          cat vite.config.ts 2>/dev/null || echo "no vite.config.ts"
          echo ""
          echo "=== dist/client/wrangler.json ==="
          cat dist/client/wrangler.json 2>/dev/null || echo "not found"
          echo ""
          echo "=== Deploy log tail ==="
          tail -30 /tmp/deploy.log
