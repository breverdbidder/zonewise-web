name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Patch SSR + bundle Worker
        run: |
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          for f in dist/server/ssr/assets/*.mjs; do [ -f "$f" ] && cp "$f" "${f%.mjs}.js"; done
          node scripts/patch-ssr.cjs
          npx esbuild worker-cf.mjs --bundle --format=esm --platform=node --conditions=worker,workerd,browser --external:node:* --external:cloudflare:* --outfile=dist/worker-bundle.mjs
          echo "Bundle: $(wc -c < dist/worker-bundle.mjs) bytes"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

      - name: Verify all routes
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          for path in "/" "/api/health" "/county" "/county/brevard" "/auctions"; do
            echo "--- $BASE$path ---"
            curl -si --max-time 20 "$BASE$path" | head -20
            echo ""
          done
