name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Inspect vinext server app-router-entry
        run: |
          echo "=== vinext/server/ contents ==="
          ls node_modules/vinext/server/ 2>/dev/null || ls node_modules/vinext/dist/server/ 2>/dev/null || echo "checking..."
          find node_modules/vinext -name "app-router*" | head -10
          echo ""
          echo "=== vinext package exports ==="
          node -e "const p=require('./node_modules/vinext/package.json'); console.log(JSON.stringify(p.exports, null, 2))" 2>/dev/null | head -40

      - name: Bundle Worker entry with esbuild
        run: |
          # Write a minimal Worker entry that uses vinext's server handler
          cat > worker-entry.mjs << 'EOF'
          import handler from "vinext/server/app-router-entry";
          export default handler;
          EOF
          
          echo "=== worker-entry.mjs ==="
          cat worker-entry.mjs
          
          # Bundle everything into a single Worker-compatible ESM file
          npx esbuild worker-entry.mjs \
            --bundle \
            --format=esm \
            --platform=browser \
            --external:node:async_hooks \
            --external:node:buffer \
            --external:node:stream \
            --external:node:util \
            --external:node:path \
            --external:node:fs \
            --external:node:os \
            --external:node:crypto \
            --external:node:url \
            --external:node:events \
            --external:node:http \
            --external:node:https \
            --external:__STATIC_CONTENT_MANIFEST \
            --outfile=dist/worker-bundle.js \
            --log-level=info 2>&1 | tail -20
          
          echo ""
          echo "=== Bundle size ==="
          ls -lh dist/worker-bundle.js 2>/dev/null || echo "bundle failed"
          echo ""
          echo "=== First 10 lines ==="
          head -10 dist/worker-bundle.js 2>/dev/null || echo "no bundle"
          echo ""
          echo "=== Has fetch export? ==="
          grep -c "export.*fetch\|fetch.*export\|default.*{.*fetch" dist/worker-bundle.js 2>/dev/null | xargs echo "fetch matches:"

      - name: Update wrangler.toml to use bundle
        run: |
          cat > wrangler.toml << 'EOF'
          name = "zonewise-vinext-test"
          main = "dist/worker-bundle.js"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat_v2"]
          
          [assets]
          directory = "dist/client"
          binding = "ASSETS"
          
          [vars]
          ENVIRONMENT = "test"
          EOF
          cat wrangler.toml

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy 2>&1

      - name: Verify live
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== GET / ==="
          curl -si --max-time 20 "$BASE/" | head -30
          echo ""
          echo "=== GET /api/health ==="
          curl -si --max-time 20 "$BASE/api/health"
