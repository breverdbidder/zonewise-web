name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Show current package.json scripts
        run: node -e "const p=require('./package.json'); console.log(JSON.stringify(p.scripts,null,2))"

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # vinext build → produces dist/server/index.mjs (fetch handler) + dist/client assets
          npm run build 2>&1 | tail -20
          echo ""
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo ""
          echo "=== dist/server/index.mjs last 5 lines ==="
          tail -5 dist/server/index.mjs
          echo ""
          # Deploy: wrangler bundles dist/server/index.mjs (which imports ./ssr/index.js)
          npx wrangler@latest deploy 2>&1

      - name: Verify live
        run: |
          sleep 15
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          for path in "/" "/api/health" "/county" "/auctions"; do
            echo "--- $path ---"
            curl -si --max-time 20 "$BASE$path" | head -8
            echo ""
          done
