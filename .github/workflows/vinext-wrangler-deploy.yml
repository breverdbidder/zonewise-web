name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Inspect dist/server/index.mjs exports and structure
        run: |
          echo "=== Last 30 lines of dist/server/index.mjs (exports) ==="
          tail -30 dist/server/index.mjs
          echo ""
          echo "=== Lines containing 'export' ==="
          grep -n "^export\|^var __export\|exports\." dist/server/index.mjs | tail -20
          echo ""
          echo "=== Dynamic import lines ==="
          grep -n "import(" dist/server/index.mjs | head -10

      - name: Build Worker bundle
        run: |
          # Fix 1: copy ssr .mjs → .js so dynamic imports resolve
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          for f in dist/server/ssr/assets/*.mjs; do
            [ -f "$f" ] && cp "$f" "${f%.mjs}.js"
          done

          # Fix 2: write a Worker wrapper that re-exports the compiled handler
          cat > worker-cf.mjs << 'WORKER_EOF'
          // Import the vinext compiled RSC server bundle
          import server from "./dist/server/index.mjs";

          export default {
            async fetch(request, env, ctx) {
              // Pass ASSETS binding so vinext can serve static files
              if (typeof server === "function") {
                return server(request, env, ctx);
              }
              if (server && typeof server.fetch === "function") {
                return server.fetch(request, env, ctx);
              }
              if (server && typeof server.default === "function") {
                return server.default(request, env, ctx);
              }
              if (server && server.default && typeof server.default.fetch === "function") {
                return server.default.fetch(request, env, ctx);
              }
              return new Response("vinext handler not found: " + typeof server + " keys:" + Object.keys(server||{}).join(","), { status: 500 });
            }
          };
          WORKER_EOF

          echo "=== worker-cf.mjs ==="
          cat worker-cf.mjs

          # Bundle with esbuild - inline dist/server relative deps, externalize node: and cloudflare:
          npx esbuild worker-cf.mjs \
            --bundle \
            --format=esm \
            --platform=node \
            --conditions=worker,workerd,browser \
            --external:"node:*" \
            --external:"cloudflare:*" \
            --external:"__STATIC_CONTENT_MANIFEST" \
            --outfile=dist/worker-bundle.mjs \
            --log-level=info 2>&1
          
          echo ""
          echo "=== Bundle stats ==="
          ls -lh dist/worker-bundle.mjs 2>/dev/null || echo "BUNDLE FAILED"
          echo ""
          echo "=== Bundle exports check ==="
          grep -c "export default\|export {" dist/worker-bundle.mjs 2>/dev/null | xargs echo "export lines:"
          head -5 dist/worker-bundle.mjs 2>/dev/null

      - name: Write wrangler.toml and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > wrangler.toml << 'EOF'
          name = "zonewise-vinext-test"
          main = "dist/worker-bundle.mjs"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat_v2"]

          [assets]
          directory = "dist/client"
          binding = "ASSETS"

          [vars]
          ENVIRONMENT = "test"
          EOF

          npx wrangler@latest deploy 2>&1

      - name: Verify live
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== GET / ==="
          curl -si --max-time 20 "$BASE/" | head -40
          echo ""
          echo "=== GET /api/health ==="
          curl -si --max-time 20 "$BASE/api/health"
