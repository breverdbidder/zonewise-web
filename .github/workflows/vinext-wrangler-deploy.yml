name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Fix .mjs → .js extension shim for wrangler bundler
        run: |
          # Wrangler's bundler resolves ./ssr/index.js but vinext outputs ./ssr/index.mjs
          # Copy all SSR .mjs files to .js so the dynamic import resolves
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          # Copy any other .mjs assets in ssr/
          for f in dist/server/ssr/assets/*.mjs; do
            cp "$f" "${f%.mjs}.js" 2>/dev/null || true
          done
          echo "=== SSR dir after fix ==="
          ls -la dist/server/ssr/
          ls -la dist/server/ssr/assets/ 2>/dev/null || true
          # Verify the import path in index.mjs
          grep -n "ssr/index" dist/server/index.mjs | head -5

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log

      - name: Verify live
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== GET / ==="
          curl -si --max-time 20 "$BASE/" | head -30
          echo ""
          echo "=== GET /api/health ==="
          curl -si --max-time 20 "$BASE/api/health"
          echo ""
          echo "=== GET /county/brevard ==="
          curl -si --max-time 20 "$BASE/county/brevard" | head -20
