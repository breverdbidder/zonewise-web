name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: |
          npm run build
          echo "=== dist/server/index.mjs (first 5 lines) ==="
          head -5 dist/server/index.mjs
          echo "=== wrangler.toml ==="
          cat wrangler.toml

      - name: Deploy with wrangler directly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log

      - name: Verify live
        run: |
          sleep 10
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== GET / ==="
          curl -si --max-time 20 "$BASE/" | head -25
          echo ""
          echo "=== GET /api/health ==="
          curl -si --max-time 20 "$BASE/api/health"
          echo ""
          echo "=== GET /county/brevard ==="
          curl -si --max-time 20 "$BASE/county/brevard" | head -15
