name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Fix SSR .mjs → .js shim
        run: |
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          for f in dist/server/ssr/assets/*.mjs; do
            cp "$f" "${f%.mjs}.js" 2>/dev/null || true
          done
          echo "SSR shims created"

      - name: Bundle Worker with esbuild (alias virtual module)
        run: |
          cat > worker-entry.mjs << 'WORKEREOF'
          import handler from "vinext/server/app-router-entry";
          export default handler;
          WORKEREOF

          npx esbuild worker-entry.mjs \
            --bundle \
            --format=esm \
            --platform=browser \
            --alias:virtual:vinext-rsc-entry=./dist/server/index.mjs \
            --external:node:async_hooks \
            --external:node:buffer \
            --external:node:stream \
            --external:node:util \
            --external:node:path \
            --external:node:fs \
            --external:node:os \
            --external:node:crypto \
            --external:node:url \
            --external:node:events \
            --external:node:http \
            --external:node:https \
            --external:node:net \
            --external:node:tls \
            --external:node:zlib \
            --external:cloudflare:sockets \
            --outfile=dist/worker-bundle.mjs \
            --log-level=info 2>&1

          echo "=== Bundle result ==="
          ls -lh dist/worker-bundle.mjs 2>/dev/null || echo "BUNDLE FAILED"
          echo "=== Has fetch export? ==="
          grep -c "fetch" dist/worker-bundle.mjs 2>/dev/null | xargs echo "fetch references:"
          head -5 dist/worker-bundle.mjs 2>/dev/null || true

      - name: Write wrangler.toml
        run: |
          cat > wrangler.toml << 'TOMLEOF'
          name = "zonewise-vinext-test"
          main = "dist/worker-bundle.mjs"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat_v2"]

          [assets]
          directory = "dist/client"
          binding = "ASSETS"

          [vars]
          ENVIRONMENT = "test"
          TOMLEOF
          cat wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy 2>&1

      - name: Verify live
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== GET / ==="
          curl -si --max-time 20 "$BASE/" | head -30
          echo ""
          echo "=== GET /api/health ==="
          curl -si --max-time 20 "$BASE/api/health"
          echo ""
          echo "=== GET /county/brevard ==="
          curl -si --max-time 20 "$BASE/county/brevard" | head -20
