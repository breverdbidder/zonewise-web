name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Inspect app-router-entry exports
        run: |
          echo "=== app-router-entry.js (first 60 lines) ==="
          head -60 node_modules/vinext/dist/server/app-router-entry.js
          echo ""
          echo "=== app-router-entry.js exports ==="
          node --input-type=module << 'EOF'
          import * as m from "./node_modules/vinext/dist/server/app-router-entry.js";
          console.log("exports:", Object.keys(m));
          console.log("default type:", typeof m.default);
          if (m.default) console.log("default keys:", Object.keys(m.default));
          EOF

      - name: Build with vinext
        run: npm run build

      - name: Fix SSR .mjs → .js shim
        run: |
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          for f in dist/server/ssr/assets/*.mjs; do cp "$f" "${f%.mjs}.js" 2>/dev/null || true; done

      - name: Write Worker entry with full error capture
        run: |
          cat > worker-entry.mjs << 'WORKEREOF'
          import handler from "vinext/server/app-router-entry";

          export default {
            async fetch(request, env, ctx) {
              try {
                // Inspect what handler actually is at runtime
                const handlerType = typeof handler;
                const handlerKeys = handler ? Object.keys(handler) : [];

                if (handlerType === "function") {
                  return await handler(request, env, ctx);
                }
                if (handler && typeof handler.fetch === "function") {
                  return await handler.fetch(request, env, ctx);
                }
                // Debug: return handler info
                return new Response(JSON.stringify({
                  error: "handler not callable",
                  handlerType,
                  handlerKeys,
                  hasDefault: !!handler,
                }), { status: 500, headers: { "Content-Type": "application/json" }});
              } catch (e) {
                return new Response(JSON.stringify({
                  error: e.message,
                  stack: e.stack?.slice(0, 500),
                }), { status: 500, headers: { "Content-Type": "application/json" }});
              }
            }
          };
          WORKEREOF

      - name: Bundle with esbuild
        run: |
          npx esbuild worker-entry.mjs \
            --bundle --format=esm --platform=browser \
            --alias:virtual:vinext-rsc-entry=./dist/server/index.mjs \
            --external:node:async_hooks --external:node:buffer --external:node:stream \
            --external:node:util --external:node:path --external:node:fs \
            --external:node:os --external:node:crypto --external:node:url \
            --external:node:events --external:node:http --external:node:https \
            --external:node:net --external:node:tls --external:node:zlib \
            --outfile=dist/worker-bundle.mjs --log-level=warning 2>&1
          ls -lh dist/worker-bundle.mjs

      - name: Write wrangler.toml
        run: |
          printf 'name = "zonewise-vinext-test"\nmain = "dist/worker-bundle.mjs"\ncompatibility_date = "2024-09-23"\ncompatibility_flags = ["nodejs_compat_v2"]\n\n[assets]\ndirectory = "dist/client"\nbinding = "ASSETS"\n\n[vars]\nENVIRONMENT = "test"\n' > wrangler.toml
          cat wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy 2>&1

      - name: Verify with error body
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "--- / ---"
          curl -s --max-time 20 "$BASE/"
          echo ""
          echo "--- /api/health ---"
          curl -s --max-time 20 "$BASE/api/health"
