name: vinext Build + Wrangler Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build with vinext
        run: npm run build

      - name: Patch SSR dynamic imports and build Worker bundle
        run: |
          # Fix 1: copy ssr files .mjs → .js
          cp dist/server/ssr/index.mjs dist/server/ssr/index.js
          for f in dist/server/ssr/assets/*.mjs; do
            [ -f "$f" ] && cp "$f" "${f%.mjs}.js"
          done

          # Fix 2: patch dist/server/index.mjs to use static import instead of dynamic
          # Replace: const ssrEntry = await import("./ssr/index.js")
          # With: const ssrEntry = ssrEntryModule
          # by prepending a static import at the top and substituting
          node << 'NODEOF'
          const fs = require('fs');
          let code = fs.readFileSync('dist/server/index.mjs', 'utf8');
          
          // Add static import at top
          const staticImport = 'import * as ssrEntryModule from "./ssr/index.js";
';
          
          // Replace all occurrences of dynamic import with the pre-loaded module
          code = code.replace(
            /const ssrEntry = await import\("\.\/ssr\/index\.js"\);/g,
            'const ssrEntry = ssrEntryModule;'
          );
          
          // Prepend static import
          code = staticImport + code;
          
          fs.writeFileSync('dist/server/index.mjs', code);
          
          // Verify patch worked
          const lines = code.split('\n');
          console.log('Line 1:', lines[0]);
          const remaining = code.match(/await import\("\.\/ssr\/index\.js"\)/g);
          console.log('Remaining dynamic imports:', remaining ? remaining.length : 0);
          NODEOF

          echo "=== Patch verification ==="
          head -3 dist/server/index.mjs
          grep -c 'await import.*ssr' dist/server/index.mjs | xargs echo "remaining dynamic ssr imports:"

          # Fix 3: write thin Worker wrapper
          cat > worker-cf.mjs << 'WORKER_EOF'
          import server from "./dist/server/index.mjs";

          export default {
            async fetch(request, env, ctx) {
              try {
                if (server && typeof server.fetch === "function") {
                  return await server.fetch(request, env, ctx);
                }
                if (typeof server === "function") {
                  return await server(request, env, ctx);
                }
                return new Response("Handler type: " + typeof server + " keys: " + Object.keys(server||{}).join(","), { status: 500 });
              } catch(e) {
                return new Response("Worker error: " + e.message + "\n" + e.stack, {
                  status: 500,
                  headers: { "content-type": "text/plain" }
                });
              }
            }
          };
          WORKER_EOF

          # Bundle - esbuild will now inline the static ssr import
          npx esbuild worker-cf.mjs \
            --bundle \
            --format=esm \
            --platform=node \
            --conditions=worker,workerd,browser \
            --external:"node:*" \
            --external:"cloudflare:*" \
            --outfile=dist/worker-bundle.mjs 2>&1
          
          echo "Bundle: $(ls -lh dist/worker-bundle.mjs 2>/dev/null | awk '{print $5}')"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > wrangler.toml << 'EOF'
          name = "zonewise-vinext-test"
          main = "dist/worker-bundle.mjs"
          compatibility_date = "2024-09-23"
          compatibility_flags = ["nodejs_compat_v2"]

          [assets]
          directory = "dist/client"
          binding = "ASSETS"

          [vars]
          ENVIRONMENT = "test"
          EOF
          npx wrangler@latest deploy 2>&1

      - name: Verify all routes
        run: |
          sleep 12
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          for path in "/" "/api/health" "/county" "/county/brevard" "/auctions"; do
            echo "--- $path ---"
            curl -si --max-time 20 "$BASE$path" | head -25
            echo ""
          done
