name: Force Vercel Production Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Vercel CLI and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          
          echo "=== Pulling project settings ==="
          vercel pull --yes --token=$VERCEL_TOKEN --environment=production 2>&1 | tail -5
          
          echo "=== Building as Next.js ==="
          vercel build --prod --token=$VERCEL_TOKEN 2>&1 | tail -20
          
          echo "=== Deploying to production ==="
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tail -10
