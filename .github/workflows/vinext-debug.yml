name: vinext Debug Worker

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check worker routes
        run: |
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          
          echo "=== Testing routes ==="
          for path in "/" "/api/health" "/county" "/auctions" "/county/brevard"; do
            echo "--- $BASE$path ---"
            curl -si --max-time 10 "$BASE$path" | head -20
            echo ""
          done

      - name: Checkout test repo
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + inspect dist
        run: |
          npm install --legacy-peer-deps
          npm run build 2>&1 | tail -20
          echo "=== dist structure ==="
          find dist -type f | head -40
          echo ""
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo ""
          echo "=== checking if vinext generates worker entry ==="
          find dist -name "*.mjs" -o -name "_worker.js" | head -10
          ls -la dist/ 2>/dev/null || echo "no dist"
          ls -la dist/server/ 2>/dev/null || echo "no dist/server"

      - name: Deploy with verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run deploy -- --log-level debug 2>&1 | tail -50

      - name: Verify after deploy
        run: |
          sleep 10
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== POST-DEPLOY CHECK ==="
          curl -si --max-time 15 "$BASE/" | head -30
          echo ""
          curl -si --max-time 15 "$BASE/api/health" | head -30
