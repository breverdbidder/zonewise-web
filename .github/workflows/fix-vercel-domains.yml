name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify domains with Vercel
        run: |
          AI_PROJECT="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          
          echo "=== Triggering verification ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/www.zonewise.ai/verify" | jq '{name, verified}'
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/zonewise.ai/verify" | jq '{name, verified}'
          
          sleep 10
          
          echo ""
          echo "=== Final status ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains" | \
            jq '.domains[] | select(.name | test("zonewise.ai")) | {name, redirect, redirectStatusCode, verified}'
          
          echo ""
          echo "=== Live redirect tests ==="
          echo -n "http://zonewise.ai -> "
          curl -sI "http://zonewise.ai/" 2>/dev/null | grep -i location || echo "no redirect header"
          echo -n "https://zonewise.ai -> "
          curl -sI "https://zonewise.ai/" 2>/dev/null | grep -i location || echo "200 (direct)"
