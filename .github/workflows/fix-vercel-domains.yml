name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Get account info
        run: |
          echo "=== Vercel User ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/user" | jq '{username, email, name, id}'
          
          echo ""
          echo "=== Vercel Teams ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams" | jq '.teams[] | {slug, name, id}'
          
          echo ""
          echo "=== zonewise-ai project details ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_B478bSAAf0yLnY3owbhN7a1W7mQs" | \
            jq '{name, accountId, link: .link, targets: .targets | keys}'
