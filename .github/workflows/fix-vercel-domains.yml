name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Get Cloudflare zone and current DNS
        run: |
          echo "=== Finding zonewise.ai zone ==="
          ZONES=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai")
          ZONE_ID=$(echo "$ZONES" | jq -r '.result[0].id')
          echo "Zone ID: $ZONE_ID"
          
          echo ""
          echo "=== Current DNS records ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=50" | \
            jq '.result[] | {name, type, content: .content[0:80], proxied}'
          
          echo ""
          echo "=== Current _vercel TXT records ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=_vercel.zonewise.ai&type=TXT" | \
            jq '.result[] | {id, name, content}'

      - name: Get Vercel verification values
        run: |
          echo "=== Vercel domain verification status ==="
          AI_PROJECT="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains" | \
            jq '.domains[] | select(.name | test("zonewise")) | {name, verified, verification}'

      - name: Add DNS verification TXT records
        run: |
          ZONES=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai")
          ZONE_ID=$(echo "$ZONES" | jq -r '.result[0].id')
          
          # Get verification values from Vercel
          AI_PROJECT="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          DOMAINS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains")
          
          # Extract verification values
          WWW_VERIFY=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "www.zonewise.ai") | .verification[0].value // empty')
          BARE_VERIFY=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "zonewise.ai") | .verification[0].value // empty')
          
          echo "www verification: $WWW_VERIFY"
          echo "bare verification: $BARE_VERIFY"
          
          # Delete existing _vercel TXT records first
          EXISTING=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=_vercel.zonewise.ai&type=TXT")
          for rid in $(echo "$EXISTING" | jq -r '.result[].id' 2>/dev/null); do
            echo "Deleting old TXT record $rid..."
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$rid" | jq '.success'
          done
          
          # Add www verification TXT
          if [ -n "$WWW_VERIFY" ]; then
            echo ""
            echo "Adding TXT for www.zonewise.ai verification..."
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$WWW_VERIFY\",\"ttl\":60}" | jq '{success, result: {id: .result.id, name: .result.name, content: .result.content}}'
          fi
          
          # Add bare domain verification TXT  
          if [ -n "$BARE_VERIFY" ]; then
            echo ""
            echo "Adding TXT for zonewise.ai verification..."
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$BARE_VERIFY\",\"ttl\":60}" | jq '{success, result: {id: .result.id, name: .result.name, content: .result.content}}'
          fi
          
          # Also ensure A/CNAME records point to Vercel
          echo ""
          echo "=== Checking A/CNAME records ==="
          A_RECORDS=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=zonewise.ai&type=A")
          echo "A records for zonewise.ai:"
          echo "$A_RECORDS" | jq '.result[] | {id, content, proxied}'
          
          CNAME_WWW=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.zonewise.ai&type=CNAME")
          echo "CNAME for www.zonewise.ai:"
          echo "$CNAME_WWW" | jq '.result[] | {id, content, proxied}'

      - name: Wait and verify with Vercel
        run: |
          echo "Waiting 30s for DNS propagation..."
          sleep 30
          
          AI_PROJECT="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          
          echo "=== Requesting Vercel re-verification ==="
          # Trigger verification check
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/zonewise.ai/verify" | jq '{name, verified}'
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/www.zonewise.ai/verify" | jq '{name, verified}'
          
          sleep 10
          
          echo ""
          echo "=== Final domain status ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains" | \
            jq '.domains[] | select(.name | test("zonewise")) | {name, redirect, redirectStatusCode, verified}'
          
          echo ""
          echo "=== Live redirect test ==="
          echo -n "http://zonewise.ai -> "
          curl -sI "http://zonewise.ai/" 2>/dev/null | grep -i location || echo "(no redirect yet - DNS may need more time)"
          echo -n "https://zonewise.ai -> "
          curl -sI "https://zonewise.ai/" 2>/dev/null | grep -i location || echo "200 OK"
