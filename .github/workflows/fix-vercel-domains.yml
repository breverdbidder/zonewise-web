name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Step 1 - Delete from zonewise-ai
        run: |
          AI="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          echo "Deleting www.zonewise.ai from zonewise-ai..."
          curl -s -w "\nHTTP:%{http_code}" -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains/www.zonewise.ai"
          echo ""
          echo "Deleting zonewise.ai from zonewise-ai..."
          curl -s -w "\nHTTP:%{http_code}" -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains/zonewise.ai"
          sleep 5
          echo ""
          echo "Verify deletion:"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains" | jq '.domains[].name'

      - name: Step 2 - Add to zonewise-web
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          echo "Adding www.zonewise.ai to zonewise-web..."
          curl -s -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB/domains" \
            -d '{"name":"www.zonewise.ai"}'
          sleep 5
          echo ""
          echo "Adding zonewise.ai redirect to zonewise-web..."
          curl -s -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB/domains" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}'

      - name: Step 3 - Verify domains
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          echo "Verifying www..."
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains/www.zonewise.ai/verify" | jq '{name, verified}'
          echo "Verifying bare..."
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains/zonewise.ai/verify" | jq '{name, verified}'
          
          sleep 10
          echo ""
          echo "=== FINAL STATE ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains" | jq '.domains[] | {name, redirect, verified}'
          
          echo ""
          echo "=== LIVE TEST ==="
          echo -n "www.zonewise.ai: "
          curl -s -o /dev/null -w "HTTP %{http_code}" "https://www.zonewise.ai/"
          echo ""
          echo -n "zonewise.ai: "
          curl -sI "https://zonewise.ai/" 2>/dev/null | grep -i location | tr -d '\r'
