name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Raw domain operations
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "=== Current state of zonewise-web ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains" 
          
          echo ""
          echo "=== Try add www.zonewise.ai RAW ==="
          curl -s -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB/domains" \
            -d '{"name":"www.zonewise.ai"}'
          
          echo ""
          echo ""
          echo "=== Try add zonewise.ai RAW ==="
          curl -s -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB/domains" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}'
          
          echo ""
          echo ""
          echo "=== Check zonewise-ai project too ==="
          AI="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains"
