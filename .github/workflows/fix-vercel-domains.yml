name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Debug Cloudflare API
        run: |
          echo "=== CF Token test (first 10 chars redacted) ==="
          echo "Token length: ${#CF_TOKEN}"
          
          echo ""
          echo "=== List zones (raw) ==="
          ZONES_RAW=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai&status=active")
          echo "$ZONES_RAW" | head -c 2000
          
          ZONE_ID=$(echo "$ZONES_RAW" | jq -r '.result[0].id // "NOT_FOUND"')
          echo ""
          echo "Zone ID: $ZONE_ID"
          
          if [ "$ZONE_ID" = "NOT_FOUND" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Trying without status filter..."
            ZONES_RAW2=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai")
            echo "$ZONES_RAW2" | head -c 2000
            ZONE_ID=$(echo "$ZONES_RAW2" | jq -r '.result[0].id // "NOT_FOUND"')
            echo "Zone ID: $ZONE_ID"
          fi
          
          if [ "$ZONE_ID" = "NOT_FOUND" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Listing ALL zones..."
            curl -s -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones" | jq '.result[] | {id, name, status}' 2>/dev/null || \
            curl -s -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones" | head -c 3000
          fi

      - name: Get DNS records
        if: always()
        run: |
          ZONE_ID="b32406b78aaaefd55557d77c843a5940"
          echo "=== DNS records (raw response) ==="
          DNS_RAW=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=50")
          echo "$DNS_RAW" | head -c 5000
          
          echo ""
          echo ""
          echo "=== Parsed records ==="
          echo "$DNS_RAW" | jq -r '.result[]? | "\(.type)\t\(.name)\t\(.content[0:60])\t\(.proxied)"' 2>/dev/null || echo "Parse failed"

      - name: Add Vercel TXT and verify
        if: always()
        run: |
          ZONE_ID="b32406b78aaaefd55557d77c843a5940"
          AI_PROJECT="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          
          # Get Vercel verification values
          echo "=== Vercel verification values ==="
          VDOMAINS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains")
          echo "$VDOMAINS" | jq '.domains[] | select(.name | test("zonewise.ai")) | {name, verified, verification}'
          
          WWW_VERIFY=$(echo "$VDOMAINS" | jq -r '.domains[] | select(.name == "www.zonewise.ai") | .verification[0].value // empty')
          BARE_VERIFY=$(echo "$VDOMAINS" | jq -r '.domains[] | select(.name == "zonewise.ai") | .verification[0].value // empty')
          
          echo "www verify: $WWW_VERIFY"
          echo "bare verify: $BARE_VERIFY"
          
          # Delete old _vercel TXT records
          OLD_TXT=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=_vercel.zonewise.ai&type=TXT")
          for rid in $(echo "$OLD_TXT" | jq -r '.result[]?.id' 2>/dev/null); do
            echo "Deleting old TXT $rid..."
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$rid" | jq '.success'
          done
          
          # Add verification TXT records
          if [ -n "$WWW_VERIFY" ]; then
            echo "Adding TXT for www..."
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$WWW_VERIFY\",\"ttl\":60}" | jq '{success}'
          fi
          
          if [ -n "$BARE_VERIFY" ]; then
            echo "Adding TXT for bare..."
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$BARE_VERIFY\",\"ttl\":60}" | jq '{success}'
          fi
          
          echo ""
          echo "Waiting 20s for DNS..."
          sleep 20
          
          echo "=== Verify with Vercel ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/www.zonewise.ai/verify" | jq '{name, verified}'
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains/zonewise.ai/verify" | jq '{name, verified}'
          
          sleep 5
          echo ""
          echo "=== Final status ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI_PROJECT/domains" | \
            jq '.domains[] | select(.name | test("zonewise.ai")) | {name, redirect, verified}'
          
          echo ""
          echo "=== Live test ==="
          curl -sI "http://zonewise.ai/" 2>/dev/null | head -3
