name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Full account audit
        run: |
          echo "=== /v2/user (personal account) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/user" | jq '.'
          
          echo ""
          echo "=== /v2/teams (all teams) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams" | jq '.teams[] | {slug, name, id}'
          
          echo ""
          echo "=== All projects with their accountId and latest deployment URL ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=20")
          echo "$PROJECTS" | jq '.projects[] | {name, id, accountId}' 
          
          echo ""
          echo "=== Latest deployment for zonewise-ai (shows full URL with scope) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_B478bSAAf0yLnY3owbhN7a1W7mQs&limit=1" | \
            jq '.deployments[0] | {url, name, creator: .creator.username, team: .team}'
          
          echo ""  
          echo "=== Latest deployment for zonewise-web ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E&limit=1" | \
            jq '.deployments[0] | {url, name, creator: .creator.username, team: .team}'
