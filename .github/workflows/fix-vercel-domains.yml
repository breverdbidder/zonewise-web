name: Fix Vercel Domain Redirect
on:
  workflow_dispatch:

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Get Vercel project and team info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== List all projects ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=10")
          echo "$PROJECTS" | jq '.projects[] | {name: .name, id: .id, framework: .framework}' 2>/dev/null || echo "$PROJECTS"
          
          # Find the zonewise-web project
          PROJECT_ID=$(echo "$PROJECTS" | jq -r '.projects[] | select(.name | test("zonewise")) | .id' | head -1)
          echo ""
          echo "Project ID: $PROJECT_ID"
          
          # Get team/org info
          echo ""
          echo "=== Team info ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams" | jq '.teams[] | {name: .name, id: .id, slug: .slug}' 2>/dev/null
          
          # List current domains
          echo ""
          echo "=== Current domains ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains" | jq '.' 2>/dev/null
          
      - name: Fix domain configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Get project ID
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=10")
          PROJECT_ID=$(echo "$PROJECTS" | jq -r '.projects[] | select(.name | test("zonewise")) | .id' | head -1)
          
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "ERROR: Could not find zonewise project"
            echo "Available projects:"
            echo "$PROJECTS" | jq '.projects[].name'
            exit 1
          fi
          
          echo "Using project: $PROJECT_ID"
          
          # Check if zonewise.ai (bare domain) is configured
          DOMAINS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains")
          echo "Current domains:"
          echo "$DOMAINS" | jq '.domains[] | {name: .name, redirect: .redirect, redirectStatusCode: .redirectStatusCode}'
          
          # Check if bare domain exists
          HAS_BARE=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "zonewise.ai") | .name')
          HAS_WWW=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "www.zonewise.ai") | .name')
          
          echo ""
          echo "Has zonewise.ai: ${HAS_BARE:-NO}"
          echo "Has www.zonewise.ai: ${HAS_WWW:-NO}"
          
          # Strategy: www.zonewise.ai should be primary, zonewise.ai should redirect to www
          
          # If bare domain missing, add it with redirect to www
          if [ -z "$HAS_BARE" ]; then
            echo ""
            echo "Adding zonewise.ai with redirect to www.zonewise.ai..."
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains" \
              -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}' | jq '.'
          else
            echo ""
            echo "Updating zonewise.ai to redirect to www.zonewise.ai..."
            # Remove and re-add with correct redirect
            curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains/zonewise.ai" | jq '.'
            sleep 2
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains" \
              -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}' | jq '.'
          fi
          
          echo ""
          echo "=== Verify final domain config ==="
          sleep 3
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains" | \
            jq '.domains[] | {name: .name, redirect: .redirect, redirectStatusCode: .redirectStatusCode, verified: .verified}'
          
          echo ""
          echo "=== Test HTTP redirect ==="
          sleep 5
          curl -sI -o /dev/null -w "http://zonewise.ai -> %{redirect_url} (HTTP %{http_code})
" "http://zonewise.ai/" || true
          curl -sI -o /dev/null -w "https://zonewise.ai -> %{redirect_url} (HTTP %{http_code})
" "https://zonewise.ai/" || true
