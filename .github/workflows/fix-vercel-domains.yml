name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check domains and add with teamId
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          AI="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
          
          echo "=== Current domains on zonewise-ai ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains?teamId=$TEAM" | jq '.domains[] | {name, redirect, verified}'
          
          echo ""
          echo "=== Adding www.zonewise.ai WITH teamId ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$AI/domains?teamId=$TEAM" \
            -d '{"name":"www.zonewise.ai"}' | jq '.'
          
          echo ""
          echo "=== Adding zonewise.ai redirect WITH teamId ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$AI/domains?teamId=$TEAM" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}' | jq '.'
          
          sleep 10
          
          echo ""
          echo "=== Verify ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains/www.zonewise.ai/verify?teamId=$TEAM" | jq '{name, verified}'
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains/zonewise.ai/verify?teamId=$TEAM" | jq '{name, verified}'
          
          echo ""
          echo "=== Final ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$AI/domains?teamId=$TEAM" | jq '.domains[] | {name, redirect, verified}'
