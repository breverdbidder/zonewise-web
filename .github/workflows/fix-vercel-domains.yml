name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Diagnose and fix domains
        run: |
          echo "Step 1: List domains on both projects"
          
          echo "--- zonewise-web domains ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains" | jq '.domains[] | {name, redirect, verified}'
          
          echo "--- zonewise-ai domains ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_B478bSAAf0yLnY3owbhN7a1W7mQs/domains" | jq '.domains[] | {name, redirect, verified}'

      - name: Remove bare domain from wrong project
        run: |
          echo "Removing zonewise.ai from zonewise-web..."
          curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains/zonewise.ai" | jq '.' || true
          sleep 5

      - name: Add bare domain to correct project with redirect
        run: |
          echo "Adding zonewise.ai -> www.zonewise.ai on zonewise-ai project..."
          curl -v -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/prj_B478bSAAf0yLnY3owbhN7a1W7mQs/domains" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}'
          echo ""
          echo "Done"

      - name: Verify final state
        run: |
          sleep 5
          echo "--- zonewise-web domains ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains" | jq '.domains[] | {name, redirect, verified}'
          echo "--- zonewise-ai domains ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_B478bSAAf0yLnY3owbhN7a1W7mQs/domains" | jq '.domains[] | {name, redirect, verified}'
