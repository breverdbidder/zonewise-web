name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE: b32406b78aaaefd55557d77c843a5940
      VERCEL_PROJECT: prj_B478bSAAf0yLnY3owbhN7a1W7mQs
    steps:
      - name: Add Vercel TXT verification records to Cloudflare
        run: |
          set -x
          
          # Get verification values from Vercel
          DOMAINS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT/domains")
          
          WWW_TXT=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "www.zonewise.ai") | .verification[0].value // empty')
          BARE_TXT=$(echo "$DOMAINS" | jq -r '.domains[] | select(.name == "zonewise.ai") | .verification[0].value // empty')
          
          echo "www TXT: $WWW_TXT"
          echo "bare TXT: $BARE_TXT"
          
          # Delete any existing _vercel TXT records
          EXISTING=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?type=TXT&name=_vercel.zonewise.ai")
          for rid in $(echo "$EXISTING" | jq -r '.result[]?.id // empty' 2>/dev/null); do
            echo "Deleting old TXT: $rid"
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$rid" > /dev/null
          done
          
          # Add TXT records
          if [ -n "$WWW_TXT" ]; then
            echo "Adding TXT: $WWW_TXT"
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$WWW_TXT\",\"ttl\":60}" | jq '.success'
          fi
          
          if [ -n "$BARE_TXT" ] && [ "$BARE_TXT" != "$WWW_TXT" ]; then
            echo "Adding TXT: $BARE_TXT"
            curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records" \
              -d "{\"type\":\"TXT\",\"name\":\"_vercel.zonewise.ai\",\"content\":\"$BARE_TXT\",\"ttl\":60}" | jq '.success'
          fi
          
      - name: Set DNS A and CNAME records for Vercel
        run: |
          set -x
          
          # Delete existing A records for apex
          for rid in $(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?type=A&name=zonewise.ai" | \
            jq -r '.result[]?.id // empty' 2>/dev/null); do
            echo "Deleting A record: $rid"
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$rid" > /dev/null
          done
          
          # Delete existing CNAME for www
          for rid in $(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?type=CNAME&name=www.zonewise.ai" | \
            jq -r '.result[]?.id // empty' 2>/dev/null); do
            echo "Deleting CNAME record: $rid"
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$rid" > /dev/null
          done
          
          # Add Vercel A record (NOT proxied)
          echo "Adding A: zonewise.ai -> 76.76.21.21"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records" \
            -d '{"type":"A","name":"zonewise.ai","content":"76.76.21.21","ttl":1,"proxied":false}' | jq '.success'
          
          # Add Vercel CNAME (NOT proxied)
          echo "Adding CNAME: www -> cname.vercel-dns.com"
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records" \
            -d '{"type":"CNAME","name":"www","content":"cname.vercel-dns.com","ttl":1,"proxied":false}' | jq '.success'
          
      - name: Verify domains with Vercel
        run: |
          echo "Waiting 20s for DNS propagation..."
          sleep 20
          
          echo "=== Verifying www.zonewise.ai ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT/domains/www.zonewise.ai/verify" | jq '{verified}'
          
          echo "=== Verifying zonewise.ai ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT/domains/zonewise.ai/verify" | jq '{verified}'
          
          sleep 10
          
          echo "=== Final status ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT/domains" | \
            jq '.domains[] | select(.name | test("zonewise")) | {name, redirect, redirectStatusCode, verified}'
          
          echo "=== Test redirects ==="
          echo -n "https://zonewise.ai -> "
          curl -sI "https://zonewise.ai/" 2>/dev/null | grep -i "location" || echo "(propagating)"
          echo -n "http://zonewise.ai -> "
          curl -sI "http://zonewise.ai/" 2>/dev/null | grep -i "location" || echo "(propagating)"
