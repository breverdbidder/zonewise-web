name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check zonewise-web deployments
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          echo "=== Latest 5 deployments on zonewise-web ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&limit=5" | \
            jq '.deployments[] | {uid, url, state, created: (.created / 1000 | todate), meta: .meta.githubCommitMessage}'

      - name: Redeploy latest successful build
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          # Find the last READY deployment
          LATEST_UID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&limit=10&state=READY" | \
            jq -r '.deployments[0].uid')
          echo "Latest ready deployment: $LATEST_UID"
          
          # Check its URL
          LATEST_URL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&limit=10&state=READY" | \
            jq -r '.deployments[0].url')
          echo "URL: $LATEST_URL"
          
          # Test feasibility on that deployment
          echo -n "Test /feasibility: "
          curl -s -o /dev/null -w "HTTP %{http_code}" "https://$LATEST_URL/feasibility"
          echo ""
          
          # Find a deployment that HAS /feasibility
          DEPLOYS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&limit=10&state=READY")
          for uid in $(echo "$DEPLOYS" | jq -r '.deployments[].uid'); do
            url=$(echo "$DEPLOYS" | jq -r --arg uid "$uid" '.deployments[] | select(.uid == $uid) | .url')
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$url/feasibility")
            msg=$(echo "$DEPLOYS" | jq -r --arg uid "$uid" '.deployments[] | select(.uid == $uid) | .meta.githubCommitMessage // "no msg"' | head -c 60)
            echo "$uid | $url | /feasibility=$code | $msg"
            if [ "$code" = "200" ]; then
              echo "FOUND working deployment: $uid"
              
              # Redeploy this one
              echo "Redeploying..."
              curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v13/deployments" \
                -d "{\"name\":\"zonewise-web\",\"deploymentId\":\"$uid\",\"target\":\"production\"}" | \
                jq '{uid, url, readyState}'
              break
            fi
          done

      - name: Re-add zonewise.ai redirect
        run: |
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          echo "=== Current domains ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains" | jq '.domains[] | {name, redirect, verified}'
          
          echo ""
          echo "=== Add zonewise.ai redirect ==="
          curl -s -w "\nHTTP:%{http_code}" -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB/domains" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}'
          
          sleep 5
          echo ""
          echo "=== Verify ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains/zonewise.ai/verify" | jq '{name, verified}'
          
          sleep 15
          echo ""
          echo "=== LIVE ==="
          for path in "" "login" "feasibility" "api/kpis" "dashboard" "app"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.zonewise.ai/$path")
            echo "www.zonewise.ai/$path: HTTP $code"
          done
