name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VAR_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      VAR_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      VAR_MAPBOX: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      VAR_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      VAR_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAR_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Add all env vars to zonewise-web
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          API="https://api.vercel.com/v9/projects/$WEB/env?teamId=$TEAM"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          
          echo "=== Current env vars ==="
          EXISTING=$(curl -s -H "$AUTH" "$API")
          echo "$EXISTING" | jq '[.envs[].key]'
          
          add_or_update() {
            local KEY="$1"
            local VALUE="$2"
            local TYPE="${3:-encrypted}"
            
            EXISTING_ID=$(echo "$EXISTING" | jq -r --arg k "$KEY" '.envs[] | select(.key == $k) | .id' | head -1)
            
            if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "UPDATE: $KEY"
              curl -s -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
                "https://api.vercel.com/v9/projects/$WEB/env/$EXISTING_ID?teamId=$TEAM" \
                -d "{\"value\":$(echo "$VALUE" | jq -Rs .),\"target\":[\"production\",\"preview\",\"development\"],\"type\":\"$TYPE\"}" | jq -r '.key // .error.message'
            else
              echo "ADD: $KEY"
              curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" "$API" \
                -d "{\"key\":\"$KEY\",\"value\":$(echo "$VALUE" | jq -Rs .),\"target\":[\"production\",\"preview\",\"development\"],\"type\":\"$TYPE\"}" | jq -r '.key // .error.message'
            fi
          }
          
          add_or_update "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$VAR_ANON_KEY" "plain"
          add_or_update "NEXT_PUBLIC_SUPABASE_URL" "$VAR_SUPABASE_URL" "plain"
          add_or_update "NEXT_PUBLIC_MAPBOX_TOKEN" "$VAR_MAPBOX" "plain"
          add_or_update "NEXT_PUBLIC_APP_URL" "$VAR_APP_URL" "plain"
          add_or_update "SUPABASE_SERVICE_ROLE_KEY" "$VAR_SERVICE_ROLE" "encrypted"
          add_or_update "ANTHROPIC_API_KEY" "$VAR_ANTHROPIC" "encrypted"
          
          echo ""
          echo "=== Final env vars ==="
          curl -s -H "$AUTH" "$API" | jq '[.envs[] | {key, target}]'

      - name: Redeploy with new env vars
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "=== Getting latest deployment to redeploy ==="
          LATEST=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&teamId=$TEAM&limit=1" | \
            jq -r '.deployments[0].uid')
          echo "Source: $LATEST"
          
          echo "Triggering redeploy..."
          RESULT=$(curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$TEAM&forceNew=1" \
            -d "{\"name\":\"zonewise-web\",\"deploymentId\":\"$LATEST\",\"target\":\"production\"}")
          
          NEW_ID=$(echo "$RESULT" | jq -r '.id // empty')
          echo "New deployment: $NEW_ID"
          echo "$RESULT" | jq '{id, url, readyState}'
          
          if [ -n "$NEW_ID" ]; then
            for i in $(seq 1 18); do
              sleep 10
              STATE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$NEW_ID?teamId=$TEAM" | jq -r '.readyState')
              echo "  ${i}0s: $STATE"
              if [ "$STATE" = "READY" ] || [ "$STATE" = "ERROR" ]; then break; fi
            done
            
            if [ "$STATE" = "READY" ]; then
              echo ""
              echo "=== VERIFICATION ==="
              sleep 5
              echo -n "Homepage: "
              curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://www.zonewise.ai/"
              echo -n "/feasibility: "
              curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://www.zonewise.ai/feasibility"
              echo -n "zonewise.ai redirect: "
              curl -sI "https://zonewise.ai/" 2>/dev/null | grep -i location
              echo -n "http redirect: "
              curl -sI "http://zonewise.ai/" 2>/dev/null | grep -i location
            fi
          fi
