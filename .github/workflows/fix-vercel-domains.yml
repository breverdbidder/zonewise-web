name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check all recent deployments
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "=== Last 10 Vercel deployments for zonewise-web ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&teamId=$TEAM&limit=10" | \
            jq '.deployments[] | {uid: .uid[0:20], url: .url[0:60], state, readyState, createdAt: (.createdAt / 1000 | strftime("%Y-%m-%dT%H:%M:%SZ")), meta: .meta.githubCommitMessage[0:60]}'
          
          echo ""
          echo "=== Latest READY deployment build output ==="
          DEP_UID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$WEB&teamId=$TEAM&limit=1&state=READY" | \
            jq -r '.deployments[0].uid')
          echo "Deployment: $DEP_UID"
          
          echo ""
          echo "=== Build output files (check for feasibility) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments/$DEP_UID/files?teamId=$TEAM" | \
            jq '.. | .name? // empty' 2>/dev/null | grep -i feasib || echo "NO feasibility files in build output"
          
          echo ""
          echo "=== Vercel project settings (build command, root dir) ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB?teamId=$TEAM" | \
            jq '{buildCommand, devCommand, installCommand, outputDirectory, rootDirectory, framework, nodeVersion, link: .link}'
          
          echo ""
          echo "=== Check .vercel/project.json in repo ==="
          echo "(checked via GitHub API earlier - not present)"
          
          echo ""
          echo "=== Verify domain status ==="
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB/domains/zonewise.ai/verify?teamId=$TEAM" | jq '{name, verified}'
