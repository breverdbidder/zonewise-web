name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Re-link GitHub repo to Vercel project
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          echo "=== Current project link status ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$WEB?teamId=$TEAM" | jq '{link}'
          
          echo ""
          echo "=== Re-link to GitHub repo ==="
          curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$WEB?teamId=$TEAM" \
            -d '{
              "gitRepository": {
                "repo": "breverdbidder/zonewise-web",
                "type": "github"
              }
            }' | jq '{name, link}'

      - name: Force production deployment  
        run: |
          TEAM="team_UEds2qBzyD9e7rOrX8aakj9K"
          WEB="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"

          echo "=== Triggering production deployment from latest main ==="
          RESULT=$(curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$TEAM" \
            -d "{
              \"name\": \"zonewise-web\",
              \"project\": \"$WEB\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"org\": \"breverdbidder\",
                \"repo\": \"zonewise-web\",
                \"ref\": \"main\"
              }
            }")
          echo "$RESULT" | jq '{id, url, readyState, target}'
          
          DEP_ID=$(echo "$RESULT" | jq -r '.id // empty')
          
          if [ -z "$DEP_ID" ]; then
            echo "Deployment failed. Full response:"
            echo "$RESULT" | jq '.'
          else
            echo ""
            echo "Deployment started: $DEP_ID"
            echo "Waiting for build (up to 120s)..."
            for i in $(seq 1 12); do
              sleep 10
              STATE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$DEP_ID?teamId=$TEAM" | jq -r '.readyState')
              echo "  ${i}0s: $STATE"
              if [ "$STATE" = "READY" ] || [ "$STATE" = "ERROR" ]; then
                break
              fi
            done
            
            echo ""
            echo "=== Final deployment status ==="
            curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEP_ID?teamId=$TEAM" | \
              jq '{readyState, url, alias, errorCode, errorMessage}'
            
            echo ""
            echo "=== Test /feasibility ==="
            curl -s -o /dev/null -w "https://www.zonewise.ai/feasibility -> HTTP %{http_code}\n" \
              "https://www.zonewise.ai/feasibility"
          fi
