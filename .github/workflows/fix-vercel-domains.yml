name: Fix Vercel Domain Redirect
on:
  push:
    paths:
      - '.github/fix-domains-trigger.txt'

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Find www.zonewise.ai across all projects
        run: |
          echo "=== Scanning ALL Vercel projects for zonewise domains ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=50")
          echo "$PROJECTS" | jq -r '.projects[].id' | while read pid; do
            pname=$(echo "$PROJECTS" | jq -r --arg id "$pid" '.projects[] | select(.id == $id) | .name')
            domains=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$pid/domains")
            has_zw=$(echo "$domains" | jq -r '.domains[]? | select(.name | test("zonewise")) | .name' 2>/dev/null)
            if [ -n "$has_zw" ]; then
              echo ""
              echo "PROJECT: $pname ($pid)"
              echo "$domains" | jq '.domains[] | {name, redirect, redirectStatusCode, verified}'
            fi
          done
          
      - name: Fix redirect
        run: |
          echo "=== Finding project with www.zonewise.ai ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=50")
          TARGET=""
          
          for pid in $(echo "$PROJECTS" | jq -r '.projects[].id'); do
            has_www=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$pid/domains" | jq -r '.domains[]? | select(.name == "www.zonewise.ai") | .name' 2>/dev/null)
            if [ "$has_www" = "www.zonewise.ai" ]; then
              pname=$(echo "$PROJECTS" | jq -r --arg id "$pid" '.projects[] | select(.id == $id) | .name')
              echo "FOUND www.zonewise.ai on project: $pname ($pid)"
              TARGET="$pid"
              break
            fi
          done
          
          if [ -z "$TARGET" ]; then
            echo "www.zonewise.ai NOT FOUND on any project!"
            echo "Will add both www.zonewise.ai and zonewise.ai to zonewise-ai project"
            TARGET="prj_B478bSAAf0yLnY3owbhN7a1W7mQs"
            
            echo "Adding www.zonewise.ai..."
            curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/$TARGET/domains" \
              -d '{"name":"www.zonewise.ai"}' | jq '.'
            sleep 3
          fi
          
          echo ""
          echo "Adding zonewise.ai with redirect to www.zonewise.ai on project $TARGET..."
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$TARGET/domains" \
            -d '{"name":"zonewise.ai","redirect":"www.zonewise.ai","redirectStatusCode":308}' | jq '.'
          
      - name: Verify
        run: |
          sleep 5
          echo "=== All zonewise domains across projects ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=50")
          for pid in $(echo "$PROJECTS" | jq -r '.projects[].id'); do
            domains=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$pid/domains")
            has_zw=$(echo "$domains" | jq -r '.domains[]? | select(.name | test("zonewise")) | .name' 2>/dev/null)
            if [ -n "$has_zw" ]; then
              pname=$(echo "$PROJECTS" | jq -r --arg id "$pid" '.projects[] | select(.id == $id) | .name')
              echo "PROJECT: $pname"
              echo "$domains" | jq '.domains[] | {name, redirect, redirectStatusCode, verified}'
            fi
          done
