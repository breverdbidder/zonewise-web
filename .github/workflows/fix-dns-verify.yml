name: "Fix Vercel DNS Verification"
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Add Vercel verification TXT record"
        run: |
          # Zone ID for zonewise.ai
          ZONE="b32406b78aaaefd55557d77c843a5940"
          
          echo "=== Check existing TXT records ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=TXT&name=_vercel.zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" | \
            python3 -c "import json,sys; [print(f'  Existing: {r[\"name\"]} = {r[\"content\"]}') for r in json.load(sys.stdin).get('result',[])]"
          
          echo "=== Adding Vercel verification TXT ==="
          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "TXT",
              "name": "_vercel.zonewise.ai",
              "content": "vc-domain-verify=zonewise.ai,631ceebdf84c5c5d2f44",
              "ttl": 1
            }')
          
          echo "$RESULT" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          if d.get('success'):
              print('✅ TXT record added')
          else:
              errors = d.get('errors', [])
              for e in errors:
                  print(f'⚠️ {e.get(\"message\",\"\")}')
                  if 'already exists' in str(e).lower():
                      print('  Record exists — skipping')
          "
          
          echo ""
          echo "=== Verify record exists ==="
          sleep 3
          dig TXT _vercel.zonewise.ai +short 2>/dev/null || nslookup -type=TXT _vercel.zonewise.ai 2>/dev/null || echo "dig not available, check via API"
          
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=TXT&name=_vercel.zonewise.ai" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" | \
            python3 -c "import json,sys; [print(f'  ✅ {r[\"name\"]} = {r[\"content\"]}') for r in json.load(sys.stdin).get('result',[])]"

      - name: "Trigger Vercel domain verification"
        run: |
          echo "=== Verify domain with Vercel ==="
          curl -s -X POST "https://api.vercel.com/v10/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains/zonewise.ai/verify" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | \
            python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          verified = d.get('verified', False)
          print(f'Verified: {verified}')
          if not verified:
              v = d.get('verification', [])
              for item in v:
                  print(f'  Need: {item.get(\"type\")} {item.get(\"domain\")} = {item.get(\"value\")}')
          "

      - name: "Trigger deploy-prod"
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/breverdbidder/zonewise-web/actions/workflows/deploy-prod.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "✅ deploy-prod triggered"

      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=🔧 *Vercel DNS Fix*: ${{ job.status }}
          Added _vercel.zonewise.ai TXT record
          Triggered domain verification
          Fired deploy-prod" || true
