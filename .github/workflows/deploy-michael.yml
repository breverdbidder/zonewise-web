name: Deploy Michael Shapira Award to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch page from GitHub
        run: |
          mkdir dist
          curl -L https://raw.githubusercontent.com/breverdbidder/michael-shapira-award/main/index.html -o dist/index.html
          ls -la dist/

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --project-name=michael-shapira-award --commit-dirty=true
