name: "TEMP: Copy CF secrets to everest-cfo-agent"

on:
  workflow_dispatch: {}

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy CLOUDFLARE_API_TOKEN
        env:
          GH_TOKEN: ${{ secrets.TEMP_CROSS_REPO_TOKEN }}
          VAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::add-mask::$VAL"
          if [ -z "$VAL" ]; then echo "CLOUDFLARE_API_TOKEN is empty on source repo"; exit 1; fi
          printf '%s' "$VAL" | gh secret set CLOUDFLARE_API_TOKEN --repo breverdbidder/everest-cfo-agent
          echo "CLOUDFLARE_API_TOKEN copied (value not shown)"

      - name: Copy CLOUDFLARE_ACCOUNT_ID
        env:
          GH_TOKEN: ${{ secrets.TEMP_CROSS_REPO_TOKEN }}
          VAL: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::$VAL"
          if [ -z "$VAL" ]; then echo "CLOUDFLARE_ACCOUNT_ID is empty on source repo"; exit 1; fi
          printf '%s' "$VAL" | gh secret set CLOUDFLARE_ACCOUNT_ID --repo breverdbidder/everest-cfo-agent
          echo "CLOUDFLARE_ACCOUNT_ID copied (value not shown)"
