name: Vercel Diagnostic V2
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Find domain project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_UEds2qBzyD9e7rOrX8aakj9K
        run: |
          echo "=== ALL PROJECTS ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?teamId=$TEAM_ID&limit=50" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('projects',[]):
            pid = p['id']
            name = p.get('name','?')
            fw = p.get('framework') or '?'
            repo = p.get('link',{}).get('repo','?')
            # Get domains from targets
            targets = p.get('targets',{})
            prod = targets.get('production',{}) if targets else {}
            prod_alias = prod.get('alias',[]) if prod else []
            # Also check aliases array
            aliases = p.get('alias',[]) or []
            all_domains = [a.get('domain','') if isinstance(a,dict) else a for a in aliases]
            print(f'{pid} | {name:30s} | fw:{fw:10s} | repo:{repo} | domains:{all_domains}')
          "

          echo ""
          echo "=== CHECK DOMAINS DIRECTLY ==="
          for PROJ in prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E; do
            echo "Project: $PROJ"
            curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$PROJ/domains?teamId=$TEAM_ID" | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            for dom in d.get('domains',[]):
              print(f'  {dom.get(\"name\",\"?\")} | verified:{dom.get(\"verified\",\"?\")}')
            if not d.get('domains'):
              print('  (no domains)')
            "
          done

          echo ""
          echo "=== FIND PROJECT WITH ZONEWISE.AI DOMAIN ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?teamId=$TEAM_ID&limit=50" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d.get('projects',[]):
            pid = p['id']
            name = p.get('name','?')
            print(f'Checking {name} ({pid})...')
          " | while read line; do
            echo "$line"
          done

          # Check each project for domains
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?teamId=$TEAM_ID&limit=50" | python3 -c "
          import json,sys,urllib.request
          d=json.load(sys.stdin)
          token = '$VERCEL_TOKEN'
          team = '$TEAM_ID'
          for p in d.get('projects',[]):
            pid = p['id']
            name = p.get('name','?')
            req = urllib.request.Request(f'https://api.vercel.com/v9/projects/{pid}/domains?teamId={team}')
            req.add_header('Authorization', f'Bearer {token}')
            try:
              resp = urllib.request.urlopen(req)
              domains = json.loads(resp.read())
              doms = [d.get('name','') for d in domains.get('domains',[])]
              if doms:
                print(f'✅ {name:30s} | {pid} | domains: {doms}')
              else:
                print(f'   {name:30s} | no custom domains')
            except Exception as e:
              print(f'❌ {name:30s} | error: {e}')
          "
