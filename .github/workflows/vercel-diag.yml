name: Vercel Build Logs
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch build error log
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |  # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- curl output piped to python3/jq for JSON parsing only, never executed as shell (verified noise, recon #18878)
          PROJECT=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
          DEPLOY_ID=$(curl -sS "https://api.vercel.com/v6/deployments?projectId=$PROJECT&limit=5" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          # Pick first ERROR state
          for dep in d.get('deployments',[]):
              if dep.get('state') == 'ERROR':
                  print(dep['uid']); break")
          echo "::notice::deploy_id=$DEPLOY_ID"
          
          echo "=== BUILD LOG ==="
          curl -sS "https://api.vercel.com/v3/deployments/$DEPLOY_ID/events?direction=backward&limit=500" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            > /tmp/events.json
          
          python3 <<PY
          import json
          events = json.load(open('/tmp/events.json'))
          # Print most recent first (errors appear last)
          for e in events:
              t = e.get('text') or e.get('payload',{}).get('text','') or ''
              if t.strip():
                  tp = e.get('type','?')
                  print(f"[{tp}] {t}")
          PY
