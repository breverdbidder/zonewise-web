name: Vercel Build Diagnostic
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Get failing deploy logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROJECT=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
          # Get last 5 deployments
          curl -sS "https://api.vercel.com/v6/deployments?projectId=$PROJECT&limit=5" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          for dep in d.get('deployments',[])[:5]:
              print(f\"  {dep['uid']}  state={dep.get('state')}  created={dep.get('created','?')}\")"
          
          echo ""
          echo "=== Events for latest deploy ==="
          DEPLOY_ID=$(curl -sS "https://api.vercel.com/v6/deployments?projectId=$PROJECT&limit=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['deployments'][0]['uid'])")
          echo "DEPLOY_ID: $DEPLOY_ID"
          
          curl -sS "https://api.vercel.com/v3/deployments/$DEPLOY_ID/events?direction=backward&limit=200&statusCode=4xx,5xx" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import json,sys
          for e in json.load(sys.stdin)[-80:]:
              txt = e.get('text') or e.get('payload',{}).get('text','') or ''
              if txt.strip():
                  print(txt[:300])" | head -200
