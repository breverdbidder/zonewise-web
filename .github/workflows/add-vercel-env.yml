name: "Push Env to Vercel"
# DEPRECATED — Vercel exit 2026-09-05 (issue #20027, part of #19812 Vercel decommission).
# Vercel env-var management for a project being decommissioned; workflow_dispatch-only already, kept as manual escape hatch.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Env var name (e.g. GEMINI_API_KEY)"
        required: true
      secret_name:
        description: "GitHub secret name to read from"
        required: true

jobs:
  push-env:
    runs-on: ubuntu-latest
    steps:
      - name: Push secret to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          INTERNAL_AUTH_TOKEN: ${{ secrets.INTERNAL_AUTH_TOKEN }}
          INPUT_SECRET_NAME: ${{ inputs.secret_name }}
          INPUT_ENV_KEY: ${{ inputs.key }}
        run: |
          SECRET_NAME="$INPUT_SECRET_NAME"
          ENV_KEY="$INPUT_ENV_KEY"

          # Map secret name to value
          VALUE=""
          case "$SECRET_NAME" in
            GEMINI_API_KEY) VALUE="$GEMINI_API_KEY" ;;
            GOOGLE_API_KEY) VALUE="$GOOGLE_API_KEY" ;;
            SUPABASE_SERVICE_ROLE_KEY) VALUE="$SUPABASE_SERVICE_ROLE_KEY" ;;
            NEXT_PUBLIC_SUPABASE_URL) VALUE="$NEXT_PUBLIC_SUPABASE_URL" ;;
            NEXT_PUBLIC_SUPABASE_ANON_KEY) VALUE="$NEXT_PUBLIC_SUPABASE_ANON_KEY" ;;
            INTERNAL_AUTH_TOKEN) VALUE="$INTERNAL_AUTH_TOKEN" ;;
            *) echo "Unknown secret: $SECRET_NAME"; exit 1 ;;
          esac
          
          if [ -z "$VALUE" ]; then
            echo "Secret $SECRET_NAME is empty"
            exit 1
          fi
          
          echo "Setting $ENV_KEY on Vercel..."
          RESULT=$(curl -s -X POST "https://api.vercel.com/v10/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"key\": \"$ENV_KEY\",
              \"value\": \"$VALUE\",
              \"type\": \"encrypted\",
              \"target\": [\"production\", \"preview\", \"development\"]
            }")
          
          echo "$RESULT" | head -c 300
          
          # Check for error
          if echo "$RESULT" | grep -q '"error"'; then
            echo ""
            echo "FAILED — check VERCEL_TOKEN validity"
            exit 1
          fi
          
          echo ""
          echo "SUCCESS: $ENV_KEY set on Vercel"
