name: "SUMMIT: Explorer V2 — Claude Code"
on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  claude-code:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'traycer'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run Claude Code — Explorer V2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          echo "=========================================="
          echo "  SUMMIT: Explorer V2 — Claude Code"
          echo "  Zero human-in-the-loop execution"
          echo "=========================================="

          # Claude Code prompt with full context
          claude -p "
          You are implementing Explorer V2 for ZoneWise.AI. Read docs/plans/EXPLORER_V2_SPEC.md for the full specification.

          CRITICAL RULES:
          - Read CLAUDE.md first for project conventions
          - Read docs/plans/EXPLORER_V2_SPEC.md for the full spec
          - Reuse existing components: ChatWidget.tsx, BrevardExplorer.tsx, lib/ai/claude.ts
          - Use brand colors: Navy #1E3A5F, Orange #F59E0B, bg #020617
          - Mapbox style: streets-v12 (colored, NOT dark)
          - All TypeScript, no any types where avoidable
          - Test that npm run build passes before committing

          IMPLEMENTATION ORDER:
          1. ZOOM-ADAPTIVE ZONING FIX (15 min)
             - In BrevardExplorer.tsx, add map.on('zoom') handler
             - Zoning raster: hidden at zoom<12, 15% opacity at 12-14, 55% at 15+
             - Parcels raster: hidden at zoom<14, 80% at 14+
             - This kills the purple overload at county zoom

          2. CHOROPLETH HEATMAP (2 hr)
             - Create lib/explorer/zillow.ts — fetch Zillow ZHVI CSV, parse, filter Brevard ZIPs
             - Create components/explorer/ChoroplethLayer.tsx
             - ZIP boundaries: use Mapbox boundaries or Census TIGER GeoJSON
             - Color scale: blue→green→yellow→orange→red by median home value
             - Dropdown to switch metrics: ZHVI, ZORI, Inventory, DOM, Price Cuts
             - Visible at zoom 9-13, fades at 14+

          3. NLP CHAT PANEL — SPLIT SCREEN (2 hr)
             - Create components/explorer/ExplorerV2.tsx as new main component
             - Left panel (380px): Chat interface based on ChatWidget.tsx
             - Right panel: Map (existing BrevardExplorer map logic)
             - Chat uses /api/explorer/chat endpoint → Claude API
             - Create app/api/explorer/chat/route.ts
             - System prompt from lib/ai/claude.ts + explorer-specific additions
             - Parse AI response for [MAP:FLY lat,lng,zoom] commands → execute on map
             - Chips: Address, Zoning, Heatmap, Auctions, Investment, Multi-family

          4. MOBILE BOTTOM SHEET (1 hr)
             - Create components/explorer/ExplorerMobileSheet.tsx
             - Collapsed: search bar + layer pills
             - Expanded: chat + parcel detail
             - CSS-only draggable sheet (no heavy deps)

          5. CONVERSION GATE (30 min)
             - After 5 parcel clicks: show upgrade modal
             - After 3 chat messages: show upgrade modal
             - Track in localStorage (counter resets daily)
             - Modal links to /signup?plan=pro

          6. ZONING TYPE FILTER (30 min)
             - Dropdown in LayerControls: All/RU/BU/PUD/AU/IU/TU
             - When selected, add vector layer from BCPAO Zoning query with WHERE clause
             - Show only matching zoning polygons

          AFTER IMPLEMENTATION:
          - Run: npx tsc --noEmit (fix all type errors)
          - Run: npm run build (must pass)
          - Commit with: feat(explorer-v2): split-screen choropleth + NLP chat + mobile + conversion
          - Push to main

          DO NOT ask questions. Execute autonomously. If blocked on something, skip it and move to the next item. Leave TODO comments for anything you skip.
          " --allowedTools "Bash(npm run build:*),Bash(npx tsc:*),Bash(git:*),Bash(cat:*),Bash(ls:*),Bash(mkdir:*),Read,Write,Edit" --dangerously-skip-permissions

      - name: Push changes
        run: |
          git config user.name "Claude Code"
          git config user.email "claude@zonewise.ai"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "feat(explorer-v2): split-screen choropleth + NLP chat + mobile + conversion funnel [SUMMIT]"
            git push origin main
          )

      - name: Trigger Vercel promote
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 90
          # Trigger promote workflow
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/promote-now.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Promote triggered"

      - name: Close issue
        if: success()
        run: |
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/41" \
            -d '{"state":"closed","state_reason":"completed"}'
          echo "Issue #41 closed"
