name: Sync Vercel Env Vars (One-Time)

on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          vercel link --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          cat .vercel/project.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])")
          ORG_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['orgId'])")
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "ORG_ID=$ORG_ID" >> $GITHUB_ENV

      - name: Set SUPABASE_SERVICE_ROLE_KEY in Vercel
        run: |
          echo "Creating SUPABASE_SERVICE_ROLE_KEY for project $PROJECT_ID..."
          RESPONSE=$(curl -s -w "
%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$ORG_ID" \
            -d "{\"key\":\"SUPABASE_SERVICE_ROLE_KEY\",\"value\":\"${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Key:', d.get('key','?'), '| Created:', d.get('createdAt', d.get('created', d.get('error',{}).get('message','unknown'))))"

      - name: Verify env vars
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$ORG_ID" | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for e in d.get('envs', []):
              targets = ','.join(e.get('target', []))
              print(f\"{e['key']}: {targets}\")
          "
