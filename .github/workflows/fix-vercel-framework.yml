name: Fix Vercel Framework & Redeploy

on:
  workflow_dispatch:

jobs:
  fix-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Reset framework and redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          
          # List all projects and find ours
          echo "=== Finding project ==="
          PROJECTS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=50")
          
          # Dump all project names
          echo "$PROJECTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data.get('projects', []):
              fwk = p.get('framework') or 'null'
              link = p.get('link', {}) or {}
              repo = link.get('repo', '') or ''
              print(f'{p[\"name\"]:30} fw={fwk:15} repo={repo}')
          "
          
          # Find by linked repo
          PROJECT_ID=$(echo "$PROJECTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data.get('projects', []):
              link = p.get('link', {}) or {}
              repo = (link.get('repo', '') or '').lower()
              name = p.get('name', '').lower()
              if 'zonewise-web' in repo or name == 'zonewise-web' or name == 'zonewise-moat':
                  print(p['id'])
                  sys.exit(0)
          # fallback: any zonewise project linked to a repo
          for p in data.get('projects', []):
              if 'zonewise' in p.get('name', '').lower():
                  print(p['id'])
                  sys.exit(0)
          sys.exit(1)
          ")
          
          echo "Found PROJECT_ID=$PROJECT_ID"
          
          # Reset framework to nextjs
          echo "=== Resetting framework to nextjs ==="
          curl -s -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID" \
            -d '{"framework":"nextjs","buildCommand":null,"outputDirectory":null}' | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Project: {data.get(\"name\",\"?\")}')
          print(f'Framework: {data.get(\"framework\",\"?\")}')
          "
          
          # Trigger redeploy
          echo "=== Triggering production redeploy ==="
          LATEST=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=1&target=production" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          deps = data.get('deployments', [])
          if deps: print(deps[0]['uid'])
          ")
          
          echo "Latest deployment: $LATEST"
          
          RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments" \
            -d "{\"name\":\"zonewise-web\",\"deploymentId\":\"$LATEST\",\"target\":\"production\"}")
          
          echo "$RESULT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Redeploy URL: https://{data.get(\"url\",\"?\")}')
          print(f'State: {data.get(\"readyState\",\"?\")}')
          print('Done!')
          " || echo "$RESULT"
