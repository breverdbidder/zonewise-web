name: "Force Alias zonewise.ai"
on:
  workflow_dispatch: {}
jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: "Install Vercel CLI"
        run: npm install -g vercel@latest
      - name: "Find latest READY deployment and alias"
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          
          echo "=== Find READY production deployment ==="
          READY_URL=$(curl -s "https://api.vercel.com/v6/deployments?projectId=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E&limit=5&target=production" \
            -H "Authorization: Bearer $TOKEN" | python3 -c "
          import json,sys
          deps = json.load(sys.stdin).get('deployments',[])
          for d in deps:
              if d.get('readyState') == 'READY':
                  print(d['url'])
                  break
          ")
          echo "Ready URL: $READY_URL"
          
          if [ -n "$READY_URL" ]; then
            echo ""
            echo "=== Alias to zonewise.ai ==="
            vercel alias set "$READY_URL" zonewise.ai --token=$TOKEN --scope=team_UEds2qBzyD9e7rOrX8aakj9K --yes 2>&1
            
            echo ""
            echo "=== Verify ==="
            sleep 10
            HTTP=$(curl -sL -o /dev/null -w "%{http_code}" "https://zonewise.ai/pricing")
            echo "zonewise.ai/pricing: HTTP $HTTP"
            
            curl -sL "https://zonewise.ai/pricing" | python3 -c "
          import sys,re
          html = sys.stdin.read()
          has_39 = '\$39' in html
          has_99 = '\$99' in html
          has_29 = '\$29' in html
          has_starter = 'Starter' in html
          print(f'Starter: {has_starter} | \$39: {has_39} | \$99: {has_99} | \$29: {has_29}')
          if has_39: print('✅ PRICING UPDATED')
          else: print('❌ STILL OLD')
          "
          fi
      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=🔧 *Force Alias*: ${{ job.status }}
          Aliased latest READY deployment to zonewise.ai" || true
