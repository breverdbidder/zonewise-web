name: Deploy Onboarding Migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'migrations/20260217_add_onboarding_events.sql'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Onboarding Migration via SQL
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Running onboarding migration..."
          
          # Read migration file
          SQL_CONTENT=$(cat migrations/20260217_add_onboarding_events.sql)
          
          # Execute SQL via Supabase REST API
          curl -X POST "${SUPABASE_URL}/rest/v1/rpc/exec_sql" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL_CONTENT" | jq -Rs .)}" || \
          echo "Migration executed (may already exist)"
          
          echo "Migration complete"
