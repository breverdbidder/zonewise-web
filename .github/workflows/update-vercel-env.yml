name: "Update Vercel Env Var"
# DEPRECATED — Vercel exit 2026-09-05 (issue #20027, part of #19812 Vercel decommission).
# Vercel env-var management for a project being decommissioned; workflow_dispatch-only already, kept as manual escape hatch.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Env var name"
        required: true
      secret_name:
        description: "GitHub secret name"
        required: true

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: Update env var on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          INPUT_SECRET_NAME: ${{ inputs.secret_name }}
          INPUT_ENV_KEY: ${{ inputs.key }}
        run: |  # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- curl output piped to python3/jq for JSON parsing only, never executed as shell (verified noise, recon #18878)
          SECRET_NAME="$INPUT_SECRET_NAME"
          ENV_KEY="$INPUT_ENV_KEY"
          PROJECT_ID="prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E"
          
          case "$SECRET_NAME" in
            GEMINI_API_KEY) VALUE="$GEMINI_API_KEY" ;;
            DEEPSEEK_API_KEY) VALUE="$DEEPSEEK_API_KEY" ;;
            SUPABASE_SERVICE_ROLE_KEY) VALUE="$SUPABASE_SERVICE_ROLE_KEY" ;;
            *) echo "Unknown: $SECRET_NAME"; exit 1 ;;
          esac
          
          [ -z "$VALUE" ] && { echo "Empty secret"; exit 1; }
          
          echo "Finding existing env var..."
          ENV_ID=$(curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            python3 -c "
          import json,sys
          for e in json.load(sys.stdin).get('envs',[]):
              if e['key'] == '$ENV_KEY':
                  print(e['id'])
                  break
          ")
          
          if [ -n "$ENV_ID" ]; then
            echo "Patching $ENV_KEY (id=$ENV_ID)..."
            curl -s -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$ENV_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"value\": \"$VALUE\"}" | head -c 200
          else
            echo "Creating $ENV_KEY..."
            curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{
                \"key\": \"$ENV_KEY\",
                \"value\": \"$VALUE\",
                \"type\": \"encrypted\",
                \"target\": [\"production\", \"preview\", \"development\"]
              }" | head -c 200
          fi
          echo ""
          echo "Done: $ENV_KEY"
