name: Add DKIM Record
on:
  repository_dispatch:
    types: [add-dkim]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Add DKIM TXT record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai" \
            -H "Authorization: Bearer $CF_TOKEN" | \
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else 'NONE')")
          echo "Zone: $ZONE_ID"

          COUNT=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=TXT&name=google._domainkey.zonewise.ai" \
            -H "Authorization: Bearer $CF_TOKEN" | \
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(len(r))")
          echo "Existing DKIM records: $COUNT"

          if [ "$COUNT" = "0" ]; then
            DKIM_VALUE="v=DKIM1;k=rsa;"

            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "{\"type\":\"TXT\",\"name\":\"google._domainkey\",\"content\":\"$DKIM_VALUE\",\"ttl\":60}" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print('DKIM CREATED' if d.get('success') else d)"
          else
            echo "DKIM already exists"
          fi
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "text=DKIM for zonewise.ai: ${{ job.status }}" || true
