name: Add Nexus CNAME
on:
  repository_dispatch:
    types: [add-nexus-cname]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Add CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=zonewise.ai" \
            -H "Authorization: Bearer $CF_TOKEN" | \
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else 'NONE')")
          echo "Zone: $ZONE_ID"
          COUNT=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=nexus.zonewise.ai" \
            -H "Authorization: Bearer $CF_TOKEN" | \
            python3 -c "import json,sys; r=json.load(sys.stdin).get('result',[]); print(len(r))")
          echo "Existing records: $COUNT"
          if [ "$COUNT" = "0" ]; then
            RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"nexus","content":"cname.vercel-dns.com","ttl":1,"proxied":false}')
            echo "Result: $RESULT"
          else
            echo "CNAME already exists"
          fi
      - name: Notify
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NEXUS DNS: ${{ job.status }} — nexus.zonewise.ai CNAME" || true

