name: Sync bun lockfile

# bun.lock had drifted out of sync with package.json — it was missing
# @react-three/fiber, @react-three/drei and gsap entirely, so any component
# importing them resolved unpinned at build time and crashed at runtime
# (TypeError: ... reading 'ReactCurrentBatchConfig').
#
# This regenerates the lockfile from package.json and commits it only if
# it actually changed. Manual dispatch only — never runs automatically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile from package.json
        run: bun install --lockfile-only

      - name: Show resolved 3D dependency versions
        run: |
          echo "--- previously missing packages ---"
          grep -o '"@react-three/fiber@[^"]*"' bun.lock || echo "fiber MISSING"
          grep -o '"@react-three/drei@[^"]*"'  bun.lock || echo "drei MISSING"
          grep -o '"gsap@[^"]*"'               bun.lock || echo "gsap MISSING"
          grep -o '"react-reconciler@[^"]*"'   bun.lock || echo "reconciler MISSING"
          grep -o '"react@[^"]*"'              bun.lock | head -1

      - name: Verify the app still builds against the new lockfile
        run: |
          bun install --frozen-lockfile
          bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock with package.json (add r3f, drei, gsap)"
          git push
