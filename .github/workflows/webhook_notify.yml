name: AgentRemote Webhook → Telegram

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed, review_requested, synchronize]
  workflow_run:
    workflows: ["AgentRemote v3.0 Cloud Executor"]
    types: [completed]
  push:
    branches: [main]
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Test notification message'
        required: false
        default: '🧪 Webhook test from GitHub Actions'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - name: Build Telegram notification
      id: message
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        REPO: ${{ github.repository }}
        SENDER: ${{ github.event.sender.login }}
        # Issue fields
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_URL: ${{ github.event.issue.html_url }}
        ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        # PR fields
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_REVIEWER: ${{ github.event.requested_reviewer.login }}
        # Workflow run fields
        WF_NAME: ${{ github.event.workflow_run.name }}
        WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        WF_URL: ${{ github.event.workflow_run.html_url }}
        # Push fields
        PUSH_REF: ${{ github.ref_name }}
        PUSH_COMMITS: ${{ github.event.commits[0].message }}
        PUSH_AUTHOR: ${{ github.event.head_commit.author.name }}
        # Manual test
        TEST_MSG: ${{ github.event.inputs.test_message }}
      run: |
        # HTML-escape dynamic user content to prevent Telegram parse errors
        html_escape() {
          echo "$1" | head -1 | python3 -c "
        import sys, html
        line = sys.stdin.read().rstrip('\n')
        print(html.escape(line))
        "
        }

        build_message() {
          case "$EVENT_NAME" in
            issues)
              SAFE_TITLE=$(html_escape "$ISSUE_TITLE")
              SAFE_SENDER=$(html_escape "$SENDER")
              SAFE_LABELS=$(html_escape "$ISSUE_LABELS")
              case "$EVENT_ACTION" in
                opened)
                  echo "🆕 <b>New Issue #${ISSUE_NUMBER}</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 By: ${SAFE_SENDER}"
                  if [ -n "$ISSUE_LABELS" ]; then
                    echo "🏷️ Labels: ${SAFE_LABELS}"
                  fi
                  echo ""
                  echo "🔗 <a href=\"${ISSUE_URL}\">View Issue</a>"
                  ;;
                closed)
                  echo "✅ <b>Issue #${ISSUE_NUMBER} Closed</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 By: ${SAFE_SENDER}"
                  echo ""
                  echo "🔗 <a href=\"${ISSUE_URL}\">View Issue</a>"
                  ;;
                labeled)
                  echo "🏷️ <b>Issue #${ISSUE_NUMBER} Labeled</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "🏷️ Labels: ${SAFE_LABELS}"
                  echo ""
                  echo "🔗 <a href=\"${ISSUE_URL}\">View Issue</a>"
                  ;;
              esac
              ;;
            pull_request)
              SAFE_TITLE=$(html_escape "$PR_TITLE")
              SAFE_SENDER=$(html_escape "$SENDER")
              SAFE_REVIEWER=$(html_escape "${PR_REVIEWER:-$SENDER}")
              case "$EVENT_ACTION" in
                opened)
                  echo "🔀 <b>New PR #${PR_NUMBER}</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 By: ${SAFE_SENDER}"
                  echo ""
                  echo "🔗 <a href=\"${PR_URL}\">Review PR</a>"
                  ;;
                closed)
                  if [ "$PR_MERGED" = "true" ]; then
                    echo "🎉 <b>PR #${PR_NUMBER} Merged!</b>"
                  else
                    echo "❌ <b>PR #${PR_NUMBER} Closed</b>"
                  fi
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 By: ${SAFE_SENDER}"
                  echo ""
                  echo "🔗 <a href=\"${PR_URL}\">View PR</a>"
                  ;;
                review_requested)
                  echo "👀 <b>Review Requested on PR #${PR_NUMBER}</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 Reviewer: ${SAFE_REVIEWER}"
                  echo ""
                  echo "🔗 <a href=\"${PR_URL}\">Review PR</a>"
                  ;;
                synchronize)
                  echo "🔄 <b>PR #${PR_NUMBER} Updated</b>"
                  echo ""
                  echo "📝 ${SAFE_TITLE}"
                  echo "👤 By: ${SAFE_SENDER}"
                  echo ""
                  echo "🔗 <a href=\"${PR_URL}\">View Changes</a>"
                  ;;
              esac
              ;;
            workflow_run)
              SAFE_WF=$(html_escape "$WF_NAME")
              SAFE_CONCLUSION=$(html_escape "$WF_CONCLUSION")
              if [ "$WF_CONCLUSION" = "success" ]; then
                echo "✅ <b>Workflow Completed</b>"
              elif [ "$WF_CONCLUSION" = "failure" ]; then
                echo "🔴 <b>Workflow FAILED</b>"
              else
                echo "⚠️ <b>Workflow: ${SAFE_CONCLUSION}</b>"
              fi
              echo ""
              echo "📦 ${SAFE_WF}"
              echo "📊 Result: ${SAFE_CONCLUSION}"
              echo ""
              echo "🔗 <a href=\"${WF_URL}\">View Run</a>"
              ;;
            push)
              # Use first line of commit message only — body often contains
              # underscores, backticks, and other chars that break Markdown
              SAFE_COMMIT=$(html_escape "$PUSH_COMMITS")
              SAFE_AUTHOR=$(html_escape "$PUSH_AUTHOR")
              echo "📦 <b>Push to ${PUSH_REF}</b>"
              echo ""
              echo "💬 ${SAFE_COMMIT}"
              echo "👤 By: ${SAFE_AUTHOR}"
              echo ""
              echo "🔗 <a href=\"https://github.com/${REPO}/commits/${PUSH_REF}\">View Commit</a>"
              ;;
            workflow_dispatch)
              SAFE_TEST=$(html_escape "$TEST_MSG")
              echo "🧪 <b>Manual Test</b>"
              echo ""
              echo "${SAFE_TEST}"
              ;;
          esac
          echo ""
          echo "📂 <code>${REPO}</code>"
        }

        MSG=$(build_message)
        # Escape for JSON
        MSG_ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
        echo "message=$MSG_ESCAPED" >> $GITHUB_OUTPUT

    - name: Send to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        MESSAGE: ${{ steps.message.outputs.message }}
      run: |  # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- curl output piped to python3/jq for JSON parsing only, never executed as shell (verified noise, recon #18878)
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "⚠️ TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set. Skipping."
          exit 0
        fi

        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{
            \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
            \"text\": ${MESSAGE},
            \"parse_mode\": \"HTML\",
            \"disable_web_page_preview\": true
          }" | python3 -c "
        import sys, json
        r = json.load(sys.stdin)
        if r.get('ok'):
            print('✅ Telegram notification sent')
        else:
            print(f'❌ Failed: {r.get(\"description\", \"Unknown error\")}')
            sys.exit(1)
        "
