name: DNS — claw.zonewise.ai
on:
  workflow_dispatch:
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE="b32406b78aaaefd55557d77c843a5940"
          
          EXISTING=$(curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=claw.zonewise.ai&type=CNAME")
          echo "Response: $(echo $EXISTING | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("success","?"))' 2>/dev/null)"
          
          COUNT=$(echo "$EXISTING" | python3 -c "import json,sys; r=json.load(sys.stdin); print(len(r.get('result',[])))" 2>/dev/null || echo "0")
          echo "Records: $COUNT"
          
          if [ "$COUNT" = "0" ]; then
            echo "Creating CNAME claw -> claw-zonewise.pages.dev"
            RESULT=$(curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records")
            echo "$RESULT" | python3 -c "import json,sys; r=json.load(sys.stdin); print('CREATED' if r.get('success') else f'ERROR: {r}')"
          else
            RID=$(echo "$EXISTING" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
            echo "Updating $RID"
            RESULT=$(curl -s -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"type":"CNAME","name":"claw","content":"claw-zonewise.pages.dev","proxied":true}' "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$RID")
            echo "$RESULT" | python3 -c "import json,sys; r=json.load(sys.stdin); print('UPDATED' if r.get('success') else f'ERROR: {r}')"
          fi
          
          sleep 10
          echo "Verify: $(curl -s -o /dev/null -w '%{http_code}' https://claw.zonewise.ai --max-time 15)"
