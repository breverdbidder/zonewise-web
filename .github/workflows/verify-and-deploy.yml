name: "Verify Domain + Deploy Production"
on:
  workflow_dispatch: {}
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Verify domain with Vercel"
        run: |
          echo "=== Verify zonewise.ai ==="
          RESULT=$(curl -s -X POST "https://api.vercel.com/v10/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains/zonewise.ai/verify" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          echo "$RESULT" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          v = d.get('verified', False)
          print(f'Verified: {v}')
          if not v:
              for item in d.get('verification',[]):
                  print(f'  Still needs: {item}')
          "
          
          echo ""
          echo "=== Domain status ==="
          curl -s "https://api.vercel.com/v9/projects/prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E/domains" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | \
            python3 -c "import json,sys; [print(f'  {d[\"name\"]:25} verified={d.get(\"verified\")}') for d in json.load(sys.stdin).get('domains',[])]"

      - name: "Install Vercel CLI"
        run: npm install -g vercel@latest

      - name: "Pull + Build + Deploy"
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --timeout 120
        env:
          VERCEL_ORG_ID: team_UEds2qBzyD9e7rOrX8aakj9K
          VERCEL_PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E

      - name: "Smoke test"
        run: |
          sleep 15
          HTTP_EXPLORER=$(curl -sL -o /dev/null -w "%{http_code}" "https://zonewise.ai/explorer")
          HTTP_PRICING=$(curl -sL -o /dev/null -w "%{http_code}" "https://zonewise.ai/pricing")
          echo "Explorer: $HTTP_EXPLORER"
          echo "Pricing:  $HTTP_PRICING"
          
          # Check pricing content
          curl -sL "https://zonewise.ai/pricing" | python3 -c "
          import sys,re
          html = sys.stdin.read()
          has_39 = '\$39' in html or '39' in html
          has_99 = '\$99' in html or '99' in html
          has_29 = '\$29' in html
          print(f'Has \$39: {has_39}')
          print(f'Has \$99: {has_99}')
          print(f'Has \$29 (old): {has_29}')
          "

      - name: "Notify"
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BIDDEED_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.BIDDEED_BOT_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=🚀 *Domain Verified + Deployed*: ${{ job.status }}
          zonewise.ai domain verification + production deploy
          Smoke test ran on /explorer and /pricing" || true
