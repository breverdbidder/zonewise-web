name: Deploy Database Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to deploy (e.g., 002_security_hardening.sql)'
        required: true
        default: '002_security_hardening.sql'
      dry_run:
        description: 'Dry run (print SQL only, do not execute)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration file exists
        run: |
          FILE="supabase/migrations/${{ github.event.inputs.migration_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE"
            exit 1
          fi
          echo "Migration file: $FILE"
          echo "Lines: $(wc -l < "$FILE")"

      - name: Dry run — print SQL
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: cat "supabase/migrations/${{ github.event.inputs.migration_file }}"

      - name: Verify secret is set
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ] && [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::Neither SUPABASE_DB_URL nor SUPABASE_DB_PASSWORD secret is set."
            echo "Set SUPABASE_DB_URL to your Supabase Session Mode connection string from:"
            echo "  Supabase Dashboard → Project Settings → Database → Connection string → Session mode (port 5432)"
            echo "Format: postgresql://postgres.[ref]:[password]@[region].pooler.supabase.com:5432/postgres"
            exit 1
          fi

      - name: Deploy migration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying: supabase/migrations/${{ github.event.inputs.migration_file }}"

          # Prefer SUPABASE_DB_URL (full connection string from dashboard)
          # Fall back to constructing URL from SUPABASE_DB_PASSWORD
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Using SUPABASE_DB_URL secret"
            DB_URL="$SUPABASE_DB_URL"
          else
            echo "Using SUPABASE_DB_PASSWORD secret with pooler"
            DB_URL="postgresql://postgres.mocerqjnksmhcjzxrewo:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
          fi

          psql "$DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f "supabase/migrations/${{ github.event.inputs.migration_file }}"
          echo "Migration deployed successfully."
