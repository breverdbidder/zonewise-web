name: Deploy Database Migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration file to deploy (e.g., 002_security_hardening.sql)'
        required: true
        default: '002_security_hardening.sql'
      dry_run:
        description: 'Dry run (print SQL only, do not execute)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration file exists
        run: |
          FILE="supabase/migrations/${{ github.event.inputs.migration_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::Migration file not found: $FILE"
            exit 1
          fi
          echo "Migration file: $FILE"
          echo "Lines: $(wc -l < "$FILE")"

      - name: Dry run — print SQL
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: cat "supabase/migrations/${{ github.event.inputs.migration_file }}"

      - name: Deploy migration
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying: supabase/migrations/${{ github.event.inputs.migration_file }}"

          # Debug: check which secrets are available (without revealing values)
          [ -n "$SUPABASE_DB_URL" ] && echo "SUPABASE_DB_URL is set (${#SUPABASE_DB_URL} chars)" || echo "SUPABASE_DB_URL is NOT set"
          [ -n "$SUPABASE_DB_PASSWORD" ] && echo "SUPABASE_DB_PASSWORD is set (${#SUPABASE_DB_PASSWORD} chars)" || echo "SUPABASE_DB_PASSWORD is NOT set"

          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Using SUPABASE_DB_URL"
            psql "$SUPABASE_DB_URL" \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${{ github.event.inputs.migration_file }}"
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Using SUPABASE_DB_PASSWORD with pooler"
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
              -h aws-0-us-east-1.pooler.supabase.com \
              -p 5432 \
              -U "postgres.mocerqjnksmhcjzxrewo" \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/${{ github.event.inputs.migration_file }}"
          else
            echo "::error::No database credentials found."
            echo "Please add one of these repository secrets (Settings → Secrets → Actions):"
            echo "  SUPABASE_DB_URL — Full connection string from Supabase Dashboard → Database → Connection string → URI (Session mode)"
            echo "  SUPABASE_DB_PASSWORD — Just the database password"
            exit 1
          fi

          echo "Migration deployed successfully."
