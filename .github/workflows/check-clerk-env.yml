name: Check Clerk Env Vars
on:
  workflow_dispatch:

jobs:
  check-env:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel env vars for Clerk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Checking Vercel project env vars ==="
          # List all env vars for the project
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/zonewise-web/env" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          envs = data.get('envs', [])
          clerk_vars = [e for e in envs if 'CLERK' in e.get('key', '')]
          print(f'Total env vars: {len(envs)}')
          print(f'Clerk env vars found: {len(clerk_vars)}')
          for e in clerk_vars:
              print(f'  {e[\"key\"]} = {e.get(\"value\", \"[encrypted]\")[:20]}...')
          if not clerk_vars:
              print('NO CLERK ENV VARS FOUND - integration not connected to project')
              # List all env var keys for debugging
              print('All env var keys:')
              for e in envs:
                  print(f'  {e[\"key\"]}')
          "
