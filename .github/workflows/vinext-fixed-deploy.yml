name: zonewise-vinext Sprint 2 — Dashboard + Stripe + Anthropic

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: vinext deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "https://zonewise-vinext-test.brevardbidderai.workers.dev"
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vinext deploy 2>&1

      - name: Push runtime secrets to CF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          V_SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          V_SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          V_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          V_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
          V_STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          V_MAPBOX: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          echo "$V_SUPABASE_URL"      | npx wrangler secret put NEXT_PUBLIC_SUPABASE_URL      --name zonewise-vinext-test 2>&1 || echo "warn: NEXT_PUBLIC_SUPABASE_URL"
          echo "$V_SUPABASE_ANON"     | npx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY  --name zonewise-vinext-test 2>&1 || echo "warn: NEXT_PUBLIC_SUPABASE_ANON_KEY"
          echo "$V_SUPABASE_SERVICE"  | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY      --name zonewise-vinext-test 2>&1 || echo "warn: SUPABASE_SERVICE_ROLE_KEY"
          echo "$V_ANTHROPIC"         | npx wrangler secret put ANTHROPIC_API_KEY              --name zonewise-vinext-test 2>&1 || echo "warn: ANTHROPIC_API_KEY"
          echo "$V_STRIPE_SECRET"     | npx wrangler secret put STRIPE_SECRET_KEY              --name zonewise-vinext-test 2>&1 || echo "warn: STRIPE_SECRET_KEY"
          echo "$V_STRIPE_WEBHOOK"    | npx wrangler secret put STRIPE_WEBHOOK_SECRET          --name zonewise-vinext-test 2>&1 || echo "warn: STRIPE_WEBHOOK_SECRET"
          echo "$V_MAPBOX"            | npx wrangler secret put NEXT_PUBLIC_MAPBOX_TOKEN       --name zonewise-vinext-test 2>&1 || echo "warn: NEXT_PUBLIC_MAPBOX_TOKEN"
          echo "Secrets step complete"

      - name: Smoke test
        run: |
          sleep 20
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"

          for path in "/" "/login" "/signup" "/dashboard"; do
            printf "%s → " "$path"
            curl -si --max-time 10 "$BASE$path" | grep "^HTTP/2" | tr -d '\r'
          done

          echo "--- /api/chat (no auth) ---"
          curl -s -X POST "$BASE/api/chat" -H "Content-Type: application/json" -d '{"message":"test"}'
          echo ""
          echo "--- /api/stripe/checkout (no auth) ---"
          curl -s -X POST "$BASE/api/stripe/checkout" -H "Content-Type: application/json" -d '{"priceId":"test"}'
          echo ""
          echo "--- /api/stripe/webhook (no sig) ---"
          curl -s -X POST "$BASE/api/stripe/webhook" -d '{}'
