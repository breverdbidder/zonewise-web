name: zonewise-vinext Sprint 2 — Dashboard + Stripe + Anthropic

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (stripe + anthropic + mapbox + supabase/ssr + CF vite plugin)
        run: npm install --legacy-peer-deps

      - name: vinext deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "https://zonewise-vinext-test.brevardbidderai.workers.dev"
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: npx vinext deploy 2>&1

      - name: Push runtime secrets to CF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --name zonewise-vinext-test 2>&1 || true
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name zonewise-vinext-test 2>&1 || true
          echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY --name zonewise-vinext-test 2>&1 || true
          echo "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name zonewise-vinext-test 2>&1 || true
          echo "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name zonewise-vinext-test 2>&1 || true

      - name: Verify — full stack smoke test
        run: |
          sleep 20
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== Sprint 2 Smoke Test ==="

          echo "--- / ---"
          curl -si "$BASE/" | grep "^HTTP/2"

          echo "--- /login (auth page) ---"
          curl -si "$BASE/login" | grep "^HTTP/2"

          echo "--- /signup ---"
          curl -si "$BASE/signup" | grep "^HTTP/2"

          echo "--- /dashboard (should 307 → /login, no session) ---"
          curl -si "$BASE/dashboard" | grep -E "^HTTP/2|^location:"

          echo "--- /api/health ---"
          curl -s "$BASE/api/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print('health:', d.get('status'))"

          echo "--- /api/auth/session (anon → 401) ---"
          curl -s "$BASE/api/auth/session" | python3 -c "import sys,json; d=json.load(sys.stdin); print('authenticated:', d.get('authenticated'))"

          echo "--- /api/chat (no auth → 401) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/chat" -H "Content-Type: application/json" -d '{"message":"test"}')
          echo "chat unauthenticated: HTTP $STATUS"

          echo "--- /api/stripe/webhook (no sig → 503 or 400) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/stripe/webhook" -d '{}')
          echo "stripe webhook (no sig): HTTP $STATUS"

          echo "=== Sprint 2 complete ==="

