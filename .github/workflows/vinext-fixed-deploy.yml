name: zonewise-vinext Sprint 2 — Dashboard + Stripe + Anthropic

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: vinext deploy (initial — builds + deploys worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "https://zonewise-vinext-test.brevardbidderai.workers.dev"
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx vinext deploy 2>&1
          echo ""
          echo "=== dist/server/wrangler.json after vinext deploy ==="
          cat dist/server/wrangler.json

      - name: Patch dist/server/wrangler.json + redeploy with server secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          V_SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          V_SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          V_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          V_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
          V_STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          V_MAPBOX: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          # Inject all runtime vars into the vinext-generated wrangler config
          python3 << 'PYEOF'
          import json, os

          path = "dist/server/wrangler.json"
          with open(path) as f:
              cfg = json.load(f)

          cfg.setdefault("vars", {})
          cfg["vars"].update({
              "NEXT_PUBLIC_SUPABASE_URL":      os.environ["V_SUPABASE_URL"],
              "NEXT_PUBLIC_SUPABASE_ANON_KEY": os.environ["V_SUPABASE_ANON"],
              "SUPABASE_SERVICE_ROLE_KEY":     os.environ["V_SUPABASE_SERVICE"],
              "ANTHROPIC_API_KEY":             os.environ["V_ANTHROPIC"],
              "STRIPE_SECRET_KEY":             os.environ["V_STRIPE_SECRET"],
              "STRIPE_WEBHOOK_SECRET":         os.environ["V_STRIPE_WEBHOOK"],
              "NEXT_PUBLIC_MAPBOX_TOKEN":      os.environ["V_MAPBOX"],
              "NEXT_PUBLIC_APP_URL":           "https://zonewise-vinext-test.brevardbidderai.workers.dev",
          })

          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)

          safe = [k for k in cfg["vars"] if "KEY" not in k and "SECRET" not in k and "TOKEN" not in k]
          print("✅ Patched wrangler.json vars:", safe)
          PYEOF

          # Redeploy with patched config — same compiled worker, now with vars
          echo "Redeploying with vars..."
          npx wrangler@3 deploy --config dist/server/wrangler.json 2>&1

      - name: Smoke test
        run: |
          sleep 20
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"

          echo "=== Pages ==="
          for path in "/" "/login" "/signup" "/dashboard"; do
            printf "%s → " "$path"
            curl -si --max-time 10 "$BASE$path" | grep "^HTTP/2" | tr -d '\r'
          done

          echo ""
          echo "=== API Routes ==="
          RESP=$(curl -s -X POST "$BASE/api/chat" -H "Content-Type: application/json" -d '{"message":"test"}')
          echo "chat: $RESP"
          if echo "$RESP" | grep -q "Missing env"; then echo "❌ ANTHROPIC_API_KEY not loaded"; exit 1; fi

          RESP=$(curl -s -X POST "$BASE/api/stripe/checkout" -H "Content-Type: application/json" -d '{"priceId":"test"}')
          echo "stripe: $RESP"
          if echo "$RESP" | grep -q "Stripe not configured"; then echo "❌ STRIPE env not loaded"; exit 1; fi

          RESP=$(curl -s -X POST "$BASE/api/stripe/webhook" -d '{}')
          echo "webhook: $RESP"

          echo ""
          echo "✅ Sprint 2 COMPLETE — $BASE"
