name: zonewise-vinext Sprint 2 — Dashboard + Stripe + Anthropic

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: vinext deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "https://zonewise-vinext-test.brevardbidderai.workers.dev"
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vinext deploy 2>&1

      - name: Push runtime secrets via Cloudflare REST API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          V_SUPABASE_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          V_SUPABASE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          V_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          V_STRIPE_SECRET: ${{ secrets.STRIPE_SECRET_KEY }}
          V_STRIPE_WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          V_MAPBOX: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          WORKER="zonewise-vinext-test"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER/secrets"

          put_secret() {
            local name="$1"
            local value="$2"
            RESP=$(curl -s -X PUT "$BASE" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$name\",\"text\":\"$value\",\"type\":\"secret_text\"}")
            SUCCESS=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success','false'))")
            if [ "$SUCCESS" = "True" ]; then
              echo "✅ set: $name"
            else
              echo "❌ failed: $name → $RESP"
              exit 1
            fi
          }

          put_secret "NEXT_PUBLIC_SUPABASE_URL"      "$V_SUPABASE_URL"
          put_secret "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$V_SUPABASE_ANON"
          put_secret "SUPABASE_SERVICE_ROLE_KEY"     "$V_SUPABASE_SERVICE"
          put_secret "ANTHROPIC_API_KEY"             "$V_ANTHROPIC"
          put_secret "STRIPE_SECRET_KEY"             "$V_STRIPE_SECRET"
          put_secret "STRIPE_WEBHOOK_SECRET"         "$V_STRIPE_WEBHOOK"
          put_secret "NEXT_PUBLIC_MAPBOX_TOKEN"      "$V_MAPBOX"

          echo "All secrets pushed ✅"

      - name: Smoke test
        run: |
          sleep 20
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"

          for path in "/" "/login" "/signup" "/dashboard"; do
            printf "%s → " "$path"
            curl -si --max-time 10 "$BASE$path" | grep "^HTTP/2" | tr -d '\r'
          done

          echo "--- /api/chat (no auth) ---"
          curl -s -X POST "$BASE/api/chat" -H "Content-Type: application/json" -d '{"message":"test"}'
          echo ""
          echo "--- /api/stripe/checkout (no auth) ---"
          curl -s -X POST "$BASE/api/stripe/checkout" -H "Content-Type: application/json" -d '{"priceId":"test"}'
          echo ""
          echo "--- /api/stripe/webhook (no sig) ---"
          curl -s -X POST "$BASE/api/stripe/webhook" -d '{}'
