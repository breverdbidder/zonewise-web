name: zonewise-vinext FIXED Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: vinext build
        run: npx vinext build

      - name: Fix ssr extension (index.mjs -> index.js)
        run: |
          echo "=== dist/server/ ==="
          find dist/server -type f | sort
          if [ -f dist/server/ssr/index.mjs ]; then
            cp dist/server/ssr/index.mjs dist/server/ssr/index.js
            echo "✅ Copied ssr/index.mjs -> ssr/index.js"
          else
            echo "⚠️ No dist/server/ssr/index.mjs - looking for alternatives"
            find dist -name "index.mjs" | head -10
          fi

      - name: Show wrangler.toml
        run: cat wrangler.toml

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1

      - name: Verify live
        run: |
          sleep 15
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== Testing live Worker ==="
          for path in "/" "/api/health"; do
            echo "--- $BASE$path ---"
            curl -si --max-time 20 "$BASE$path" | head -8
            echo ""
          done

