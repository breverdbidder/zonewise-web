name: zonewise-vinext FIXED Deploy v2 (CF-native RSC)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout zonewise-vinext-test
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-vinext-test
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (includes @cloudflare/vite-plugin)
        run: npm install --legacy-peer-deps

      - name: Show vite.config.ts + wrangler.jsonc
        run: |
          echo "=== vite.config.ts ==="
          cat vite.config.ts
          echo ""
          echo "=== wrangler.jsonc ==="
          cat wrangler.jsonc
          echo ""
          echo "=== worker/index.ts ==="
          cat worker/index.ts

      - name: vinext deploy (builds CF-native RSC bundle + deploys via wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx vinext deploy 2>&1
          echo "Exit: $?"

      - name: Verify live (wait 15s for propagation)
        run: |
          sleep 15
          BASE="https://zonewise-vinext-test.brevardbidderai.workers.dev"
          echo "=== Testing live Worker ==="
          for path in "/" "/api/health" "/county"; do
            echo "--- $BASE$path ---"
            RESP=$(curl -si --max-time 20 "$BASE$path" 2>/dev/null)
            echo "$RESP" | head -6
            echo "$RESP" | tail -3
            echo ""
          done

