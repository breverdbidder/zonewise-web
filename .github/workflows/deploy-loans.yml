name: Deploy ZoneWise Loans

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-loans]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zonewise-loans
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-loans
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Create Cloudflare Pages project (if needed)
        run: |
          npm install -g wrangler
          wrangler pages project create zonewise-loans --production-branch main 2>/dev/null || echo "Project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy dist --project-name=zonewise-loans --commit-dirty=true --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Output URL
        run: echo "🚀 Live at https://zonewise-loans.pages.dev"

  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zonewise-loans
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-loans
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1) || \
          URL=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Vercel: $URL"
        continue-on-error: true
