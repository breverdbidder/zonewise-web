name: Deploy ZoneWise Loans

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-loans]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zonewise-loans
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-loans
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create Cloudflare Pages project (if needed)
        run: |
          npm install -g wrangler
          wrangler pages project create zonewise-loans --production-branch main 2>/dev/null || echo "Project exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist --project-name=zonewise-loans --commit-dirty=true --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Output URL
        run: echo "🚀 Live at https://zonewise-loans.pages.dev"
