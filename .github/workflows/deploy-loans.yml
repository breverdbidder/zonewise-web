name: Deploy ZoneWise Loans to Cloudflare Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-loans]

jobs:
  deploy-loans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zonewise-loans
        uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-loans
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zonewise-loans --commit-dirty=true

      - name: Output deployment URL
        run: echo "🚀 Deployed to https://zonewise-loans.pages.dev"
