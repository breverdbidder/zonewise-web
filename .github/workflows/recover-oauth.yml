name: Recover OAuth
on:
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret length
        env:
          B64: ${{ secrets.CLAUDE_OAUTH_B64 }}
        run: |
          LEN=$(echo -n "$B64" | wc -c)
          echo "ZONEWISE-WEB SECRET LENGTH: $LEN"
          if [ "$LEN" -lt 100 ]; then
            echo "FAIL: secret too short, abort"
            exit 1
          fi
          echo "$B64" | base64 -d > /tmp/creds.json
          wc -c /tmp/creds.json
          python3 -c "import json; d=json.load(open(\"/tmp/creds.json\")); print(\"keys:\", list(d.get(\"claudeAiOauth\",{}).keys()))"
