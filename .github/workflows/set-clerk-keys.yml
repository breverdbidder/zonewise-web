name: Set Clerk production keys

# Takes the Clerk keys as dispatch INPUTS so they are never committed to the
# repository. Values are written straight to Vercel production and masked in
# logs. Rotate the secret key in Clerk after a successful run.

on:
  workflow_dispatch:
    inputs:
      pk:
        description: "Clerk publishable key (pk_...)"
        required: true
      sk:
        description: "Clerk secret key (sk_...)"
        required: true

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
      TEAM_ID: team_UEds2qBzyD9e7rOrX8aakj9K
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PK: ${{ github.event.inputs.pk }}
      SK: ${{ github.event.inputs.sk }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask secrets
        run: |
          echo "::add-mask::$SK"
          echo "::add-mask::$PK"

      - name: Validate key format
        run: |
          case "$PK" in pk_test_*|pk_live_*) echo "publishable key format ok";; *) echo "BAD publishable key format"; exit 1;; esac
          case "$SK" in sk_test_*|sk_live_*) echo "secret key format ok";; *) echo "BAD secret key format"; exit 1;; esac

      - name: Write to Vercel production
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" > env.json
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          tok=os.environ['VERCEL_TOKEN']; pid=os.environ['PROJECT_ID']; team=os.environ['TEAM_ID']
          vals={'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY':os.environ['PK'],
                'CLERK_SECRET_KEY':os.environ['SK'],
                'NEXT_PUBLIC_CLERK_SIGN_IN_URL':'/sign-in',
                'NEXT_PUBLIC_CLERK_SIGN_UP_URL':'/sign-up'}
          envs=json.load(open('env.json')); envs=envs.get('envs',envs if isinstance(envs,list) else [])

          def existing_prod(key):
              for e in envs:
                  if e['key']==key and e.get('target')==['production']:
                      return e['id']
              return None

          for k,v in vals.items():
              eid=existing_prod(k)
              if eid:
                  req=urllib.request.Request(
                    f"https://api.vercel.com/v9/projects/{pid}/env/{eid}?teamId={team}",
                    data=json.dumps({"value":v}).encode(), method='PATCH',
                    headers={'Authorization':f'Bearer {tok}','Content-Type':'application/json'})
                  action='UPDATED'
              else:
                  req=urllib.request.Request(
                    f"https://api.vercel.com/v10/projects/{pid}/env?teamId={team}",
                    data=json.dumps({"key":k,"value":v,"type":"encrypted",
                                     "target":["production"]}).encode(), method='POST',
                    headers={'Authorization':f'Bearer {tok}','Content-Type':'application/json'})
                  action='ADDED'
              try:
                  urllib.request.urlopen(req).read()
                  print(f"  {action} {k}")
              except urllib.error.HTTPError as ex:
                  print(f"  FAILED {k}: {ex.code} {ex.read()[:180]}")
                  raise SystemExit(1)
          PY

      - name: Build and deploy
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Smoke test
        run: |
          sleep 30
          fail=0
          for r in / /pricing /feasibility /sign-in /sign-up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://zonewise.ai$r)
            echo "$code  $r"
            [ "$code" = "200" ] || fail=1
          done
          if curl -s https://zonewise.ai | grep -q 'clerk.accounts.dev'; then
            echo "clerk frontend api present in landing html"
          else
            echo "WARNING: clerk not referenced in landing html"
          fi
          exit $fail
