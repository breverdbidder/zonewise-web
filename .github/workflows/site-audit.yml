name: "Site Audit (production)"
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
  # Audit the deploy that actually shipped, not the commit that triggered it.
  # A push trigger fires while deploy-prod is still building, so the harness
  # loads a stale HTML shell pointing at JS chunk hashes that are rotating out,
  # and reports phantom 404-on-chunk blockers. Chaining off deploy-prod removes
  # that race entirely.
  workflow_run:
    workflows: ["Deploy to Vercel Production"]
    types: [completed]

# Without this, a single six-file push spawned FIVE parallel production audits
# that rate-limited the site (429) and produced false blockers. One at a time.
concurrency:
  group: site-audit
  cancel-in-progress: true

jobs:
  audit:
    # Never audit against a build that did not ship.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # deploy-prod aliases zonewise.ai as its final step; let the alias
      # propagate before the harness starts loading pages.
      - name: Settle after deploy
        if: github.event_name == 'workflow_run'
        run: sleep 25

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # "npm install playwright" pulls the LATEST playwright, drifting from
      # the version pinned in package-lock.json and mismatching the browser
      # build ("Executable doesn't exist"). npm ci installs exactly what is
      # pinned; the audit's `playwright` import resolves via @playwright/test.
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run audit
        id: audit
        continue-on-error: true
        run: node scripts/audit-site.mjs --json=report.json

      - name: Summarize
        if: always()
        run: |
          if [ -f report.json ]; then
            node -e "
              const r = require('./report.json').results;
              const b = r.filter(x => x.severity === 'BLOCKER');
              const w = r.filter(x => x.severity === 'WARN');
              console.log(b.length + ' blockers, ' + w.length + ' warnings');
              const lines = b.map(x => '- **' + x.view + '** [' + x.kind + '] ' + x.detail).join('\n');
              require('fs').writeFileSync('summary.md', '## Site audit — ' + b.length + ' blockers, ' + w.length + ' warnings\n\n' + (lines || '_No blockers._'));
            "
          else
            echo "## Site audit — harness did not produce a report (crashed)" > summary.md
          fi

      - name: File / update GitHub issue on blockers
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BLOCKERS=$(node -e "console.log(require('fs').existsSync('report.json') ? require('./report.json').results.filter(x=>x.severity==='BLOCKER').length : 1)")
          if [ "$BLOCKERS" -gt 0 ]; then
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-audit --state open --json number --jq '.[0].number' || echo "")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file summary.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Site audit: $BLOCKERS blocker(s) on production" --body-file summary.md --label site-audit
            fi
          else
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label site-audit --state open --json number --jq '.[0].number' || echo "")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "✅ Audit is clean — closing." || true
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" || true
            fi
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f summary.md ] && curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$(cat summary.md | head -c 3500)" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: report.json
          if-no-files-found: ignore
