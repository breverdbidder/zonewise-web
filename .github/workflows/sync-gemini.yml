name: "Sync Gemini Key from CLIProxy"
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch key from Hetzner and test
        env:
          HETZNER_IP: ${{ secrets.HETZNER_IP }}
        run: |
          # The Gemini key is in the CLIProxy container's env on Hetzner
          # But we can't SSH from here without the key.
          # Instead, test the key directly from cliproxy health endpoint
          echo "Testing CLIProxy gateway..."
          RESULT=$(curl -s --max-time 10 "http://87.99.129.125:8317/health" 2>/dev/null || echo "TIMEOUT")
          echo "Health: $RESULT"
          
      - name: Verify paid key from secret
        env:
          GEMINI_API_KEY_PAID: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "Testing GOOGLE_API_KEY as Gemini key..."
          echo "Prefix: ${GEMINI_API_KEY_PAID:0:10}"
          echo "Length: ${#GEMINI_API_KEY_PAID}"
          
          RESULT=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY_PAID" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"Say hello"}]}],"generationConfig":{"maxOutputTokens":20}}')
          
          if echo "$RESULT" | grep -q "candidates"; then
            echo "SUCCESS — this key works for Gemini!"
          else
            echo "Result: $(echo $RESULT | head -c 300)"
          fi
