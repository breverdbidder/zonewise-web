name: Health Probe

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        id: health
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" https://zonewise.ai/api/health)
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/health.json
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/health returned $STATUS"
            exit 1
          fi
          # Assert status=ok in response
          STATUS_FIELD=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))")
          echo "status_field=$STATUS_FIELD" >> $GITHUB_OUTPUT
          if [ "$STATUS_FIELD" != "ok" ]; then
            echo "FAIL: health status=$STATUS_FIELD"
            exit 1
          fi

      - name: Check homepage
        id: homepage
        run: |
          STATUS=$(curl -s -o /tmp/home.html -w "%{http_code}" https://zonewise.ai/)
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: homepage returned $STATUS"
            exit 1
          fi
          # Assert key content is present
          if ! grep -q "ZoneWise" /tmp/home.html; then
            echo "FAIL: homepage missing ZoneWise content"
            exit 1
          fi

      - name: Check /api/stats
        id: stats
        run: |
          STATUS=$(curl -s -o /tmp/stats.json -w "%{http_code}" https://zonewise.ai/api/stats)
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/stats.json
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/stats returned $STATUS"
            exit 1
          fi
          # Assert counties field exists
          COUNTIES=$(cat /tmp/stats.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('counties',0))")
          echo "counties=$COUNTIES" >> $GITHUB_OUTPUT
          if [ "$COUNTIES" = "0" ]; then
            echo "FAIL: /api/stats counties=0"
            exit 1
          fi

      - name: Telegram alert on failure
        if: failure()
        run: |
          HEALTH_STATUS="${{ steps.health.outputs.status_field || 'unreachable' }}"
          COUNTIES="${{ steps.stats.outputs.counties || 'unknown' }}"
          MESSAGE="🔴 ZoneWise Health Probe FAILED%0A%0AHealth: $HEALTH_STATUS%0ACounties: $COUNTIES%0ATime: $(date -u '+%Y-%m-%d %H:%M UTC')%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=$MESSAGE" > /dev/null

      - name: Log to Supabase
        if: always()
        run: |
          OVERALL="${{ job.status }}"
          HEALTH_HTTP="${{ steps.health.outputs.http_status || '0' }}"
          STATS_HTTP="${{ steps.stats.outputs.http_status || '0' }}"
          HOME_HTTP="${{ steps.homepage.outputs.http_status || '0' }}"
          PAYLOAD="{\"status\":\"$OVERALL\",\"health_http\":$HEALTH_HTTP,\"stats_http\":$STATS_HTTP,\"home_http\":$HOME_HTTP,\"run_id\":\"${{ github.run_id }}\",\"checked_at\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\"}"
          curl -s -X POST "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/health_probe_results" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null || true  # Non-blocking — probe result doesn't depend on logging
