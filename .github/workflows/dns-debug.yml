name: DNS Debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: List ALL DNS records
        run: |
          ZONE_ID="b32406b78aaaefd55557d77c843a5940"
          
          echo "=== ALL DNS records for zonewise.ai ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          records = data.get('result', [])
          print(f'Total records: {len(records)}')
          for r in records:
              print(f'{r[\"type\"]:8s} | {r[\"name\"]:30s} | {r[\"content\"]:50s} | proxied={r.get(\"proxied\",\"N/A\")} | id={r[\"id\"]}')
          "
          
      - name: Check Vercel domain status
        run: |
          echo "=== Vercel domains for zonewise-web ==="
          curl -s "https://api.vercel.com/v9/projects/zonewise-web/domains" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | python3 -m json.tool
            
      - name: Check current resolution
        run: |
          echo "=== dig zonewise.ai ==="
          dig +short zonewise.ai A
          dig +short zonewise.ai CNAME
          
          echo ""
          echo "=== curl headers ==="
          curl -sI https://zonewise.ai | head -20
          
          echo ""
          echo "=== Page title ==="
          curl -s https://zonewise.ai | grep -o "<title>[^<]*</title>"
