name: Greptile Full Codebase Audit

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to post results to'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check repository index status
        id: status
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
        run: |
          if [ -z "$GREPTILE_API_KEY" ]; then
            echo "missing_key=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /tmp/status.json -w "%{http_code}" \
            -H "Authorization: Bearer $GREPTILE_API_KEY" \
            -H "X-GitHub-Token: ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.greptile.com/v2/repositories/github%3Amain%3Abreverdbidder%2Fzonewise-web")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          cat /tmp/status.json
          STATUS=$(jq -r '.status // "UNKNOWN"' /tmp/status.json 2>/dev/null || echo "UNKNOWN")
          echo "index_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Report missing key
        if: steps.status.outputs.missing_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.inputs.issue_number }}" --body "GREPTILE_API_KEY secret is not set (or not readable) in this repo's Actions secrets. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."

      - name: Queue indexing if not ready
        if: steps.status.outputs.missing_key != 'true' && steps.status.outputs.index_status != 'COMPLETED'
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST "https://api.greptile.com/v2/repositories" \
            -H "Authorization: Bearer $GREPTILE_API_KEY" \
            -H "X-Github-Token: ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"remote":"github","repository":"breverdbidder/zonewise-web","branch":"main"}' \
            -o /tmp/queue.json
          cat /tmp/queue.json
          gh issue comment "${{ github.event.inputs.issue_number }}" --body "Repository index status was \`${{ steps.status.outputs.index_status }}\` (HTTP ${{ steps.status.outputs.http_code }}) - indexing has been queued. Re-run this workflow (workflow_dispatch, same issue_number) in 10-30 minutes once indexing completes."

      - name: Run full audit query
        if: steps.status.outputs.missing_key != 'true' && steps.status.outputs.index_status == 'COMPLETED'
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT='You are auditing the zonewise-web repository (Next.js 16 App Router, Vercel, Supabase, TypeScript) for ZoneWise.AI. Walk the full indexed codebase, not just recent changes. Report findings grouped under: (1) API endpoints in app/api/**/route.ts - input validation, CORS scope, auth/paywall trust boundaries, service-role vs anon Supabase client usage; (2) public route surface vs sitemap - any auth-gated route publicly listed, or public route missing from the sitemap, or IDOR risk on parcel/report/card/property routes by ID; (3) security - CSP directives in middleware.ts and next.config.mjs, any inline script missing a nonce, Permissions-Policy scope, hardcoded credentials anywhere in source, Edge Function secret handling and CORS; (4) documentation drift between docs/ARCHITECTURE.md and docs/plans/*.md versus what is actually deployed; (5) general code quality - TypeScript any usage, unhandled promise rejections, console.log in production paths, and drift between components/floorplan/VoiceDraftsman.tsx and components/chat/VoiceZoningAssistant.tsx (intentionally near-duplicate voice clients). Return a table, most severe finding first, with file path, line, severity, and a one-line fix. State explicitly if a section has no findings.'
          jq -n --arg prompt "$PROMPT" '{
            messages: [{content: $prompt, role: "user"}],
            repositories: [{remote: "github", repository: "breverdbidder/zonewise-web", branch: "main"}],
            sessionId: "zonewise-full-audit"
          }' > /tmp/query.json
          curl -s -X POST "https://api.greptile.com/v2/query" \
            -H "Authorization: Bearer $GREPTILE_API_KEY" \
            -H "X-Github-Token: ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/query.json \
            -o /tmp/result.json
          cat /tmp/result.json
          ANSWER=$(jq -r '.message // "(no message field in response - see raw JSON below)"' /tmp/result.json)
          {
            echo "## Greptile Full Codebase Audit — Result"
            echo ""
            echo "$ANSWER"
            echo ""
            echo "<details><summary>Raw response</summary>"
            echo ""
            echo '```json'
            cat /tmp/result.json
            echo '```'
            echo "</details>"
          } > /tmp/comment_body.md
          gh issue comment "${{ github.event.inputs.issue_number }}" --body-file /tmp/comment_body.md
