name: Verify Fix Deployed
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: List recent production deployments with state
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PROJECT=prj_EaXgEO6WDoSpCeLhuCemtbPr6e8E
          curl -sS "https://api.vercel.com/v6/deployments?projectId=$PROJECT&target=production&limit=5" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          for dep in d['deployments']:
              meta = dep.get('meta',{})
              print(dep.get('state'), '|', meta.get('githubCommitSha','')[:12], '|', (meta.get('githubCommitMessage') or '')[:60])
          "
