name: Dashboard 500 Runtime Log Diag
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger error then fetch vercel runtime logs (status 500)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest --no-fund --no-audit 2>&1 | tail -3
          for p in /dashboard /massing /explorer /floorplan; do
            curl -s -o /dev/null -w "%{http_code} $p\n" "https://zonewise.ai$p"
          done
          sleep 5
          echo "=== vercel logs, status 500, last 10m, expanded ==="
          vercel logs https://zonewise.ai --token="$VERCEL_TOKEN" --status-code 500 --since 10m --expand --non-interactive 2>&1 | tee /tmp/vlogs.txt
          { echo '### vercel 500 logs'; echo '```'; cat /tmp/vlogs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
