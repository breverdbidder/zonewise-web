name: Dashboard 500 Runtime Log Diag
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Stream runtime logs while triggering the 500
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest --no-fund --no-audit 2>&1 | tail -3
          vercel logs https://zonewise.ai --token="$VERCEL_TOKEN" --follow --expand --non-interactive > /tmp/follow.log 2>&1 &
          FPID=$!
          sleep 8
          for i in 1 2; do
            for p in /dashboard /massing /explorer /floorplan; do
              curl -s -o /dev/null -w "%{http_code} $p\n" "https://zonewise.ai$p"
            done
            sleep 2
          done
          sleep 10
          kill $FPID 2>/dev/null || true
          echo "=== FOLLOW LOG ==="
          cat /tmp/follow.log
          { echo '### follow log'; echo '```'; cat /tmp/follow.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
