<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080A0D;color:#E2E8F4;font-family:'DM Sans',sans-serif}
.syne{font-family:'Syne',sans-serif}.mono{font-family:'JetBrains Mono',monospace}
@keyframes pulse-ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes data-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(245,166,35,.12)}50%{box-shadow:0 0 32px rgba(245,166,35,.45)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes border-pulse{0%,100%{border-color:rgba(245,166,35,.3)}50%{border-color:rgba(245,166,35,.85)}}
@keyframes scanline{0%{top:0%;opacity:.6}100%{top:110%;opacity:0}}
@keyframes cursor-blink{0%,100%,49%{opacity:1}50%,99%{opacity:0}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0F1117}::-webkit-scrollbar-thumb{background:#2A3145;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>

  {addr:"1104 Atlantic Dr",    city:"Satellite Beach 32937",arv:512000,maxBid:287400,judgment:389000,tag:"REVIEW",score:68,liens:["1st Mortgage: $389,000"],sqft:2644,year:2001},
  {addr:"3301 S Banana River", city:"Cocoa Beach 32931",    arv:298000,maxBid:83600, judgment:271000,tag:"SKIP",  score:31,liens:["1st Mortgage: $271,000","Code Liens: $22,400","HOA: $9,800"],sqft:1520,year:1973},

const LOGS=[
  "[DiscoverWise] Connecting to auction calendar ...","[DiscoverWise] Session authenticated",
  "[GatherWise]  Loading Brevard County auctions ...","[DiscoverWise] 19 properties found for analysis",
  "[GatherWise]  Fetching parcel + BCPAO data ...","[TitleWise]   Title chain verification running",

    {l:"Cap Rate",               v:"8.8%",     s:"Annual NOI / ARV",           score:78},

  ]},
  {id:"mkt",  label:"NeighborWise Intelligence",        icon:"◈",  color:"#3D6FFF", count:68, kpis:[
    {l:"Zip Median Sale Price",  v:"$398,000", s:"32931 — L12M median",        score:82},
    {l:"Days on Market (Avg)",   v:"24 days",  s:"32931 — L90D",               score:88},
    {l:"List-to-Sale Ratio",     v:"98.4%",    s:"Hot seller market",          score:91},
    {l:"Price Appreciation YoY", v:"+7.2%",    s:"Brevard County",             score:85},
    {l:"Inventory Level",        v:"1.8 mo",   s:"Below 3mo = seller's mkt",   score:90},
    {l:"Foreclosure Rate",       v:"0.31%",    s:"Below FL avg 0.48%",         score:76},
    {l:"MTR Demand Score",       v:"91/100",   s:"32937 AirDNA data",          score:91,hi:true},
    {l:"Rental Vacancy Rate",    v:"4.2%",     s:"32937 zip",                  score:84},
    {l:"Population Growth 5yr",  v:"+6.8%",    s:"Brevard County",             score:79},
    {l:"Median HH Income",       v:"$79,400",  s:"32937 Census ACS",           score:88},
    {l:"Walkability Score",      v:"52/100",   s:"Car-dependent area",         score:55},
    {l:"Flood Zone",             v:"Zone X",   s:"Minimal flood risk",         score:92},
  ]},

    {l:"Title Chain Integrity",  v:"CLEAN",    s:"No breaks detected",         score:98,hi:true},
    {l:"Senior Lien Survived?",  v:"CHECK",    s:"HOA foreclosure — verify",   score:60},
    {l:"Open Permits",           v:"0",        s:"BCPAO permit search",        score:100},
    {l:"Code Violations",        v:"0",        s:"City of Cocoa Beach",        score:100},

    {l:"Tax Delinquency",        v:"Current",  s:"2024 taxes paid",            score:100},

    {l:"Mold/WDO Risk",          v:"Moderate", s:"1987 build — inspect req",   score:62},

  {id:"nbr",  label:"NeighborWise + TaxWise",  icon:"◉",  color:"#00D68F", count:74, kpis:[
    {l:"School District Rating", v:"B+",       s:"Brevard County Schools",     score:82},
    {l:"Crime Index",            v:"32/100",   s:"Lower = safer. FL avg: 48",  score:85},

const fmt=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const TAG={BID:{bg:"rgba(0,214,143,.08)",bd:"rgba(0,214,143,.5)",tx:"#00D68F"},REVIEW:{bg:"rgba(255,187,51,.08)",bd:"rgba(255,187,51,.5)",tx:"#FFBB33"},SKIP:{bg:"rgba(255,71,87,.08)",bd:"rgba(255,71,87,.5)",tx:"#FF4757"}};
const LC={INIT:"#5A6480",AUTH:"#3D6FFF",SCRAPE:"#F5A623",FOUND:"#00D68F",BCPAO:"#8492B0",TITLE:"#8492B0",LIEN:"#FFBB33",ML:"#3D6FFF",SCORE:"#00D68F",RPT:"#8492B0",DONE:"#00D68F"};

function AgentNode({agent,status}){
  const c={idle:"#2A3145",active:"#F5A623",done:"#00D68F"}[status];
  const tc={idle:"#5A6480",active:"#E2E8F4",done:"#E2E8F4"}[status];
  return(
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"11px 15px",
      background:status==="active"?"rgba(245,166,35,.05)":"transparent",
      border:`1px solid ${status==="active"?"rgba(245,166,35,.3)":"#1E2433"}`,
      borderRadius:9,transition:"all .35s",
      animation:status==="active"?"glow 2s ease infinite,border-pulse 2s ease infinite":"none"}}>
      <div style={{position:"relative",width:30,height:30,flexShrink:0}}>
        {status==="active"&&<>
          <div style={{position:"absolute",top:0,right:0,bottom:0,left:0,borderRadius:"50%",border:"2px solid #F5A623",animation:"pulse-ring 1.3s ease-out infinite"}}/>
          <div style={{position:"absolute",top:0,right:0,bottom:0,left:0,borderRadius:"50%",border:"2px solid #F5A623",animation:"pulse-ring 1.3s ease-out infinite",animationDelay:".4s"}}/>
        </>}
        <div style={{width:30,height:30,borderRadius:"50%",border:`2px solid ${c}`,display:"flex",alignItems:"center",justifyContent:"center",
          background:status==="done"?"rgba(0,214,143,.1)":status==="active"?"rgba(245,166,35,.08)":"transparent",
          fontSize:12,color:c,transition:"all .35s",
          animation:status==="active"?"spin 2.5s linear infinite":"none",fontFamily:"monospace"}}>
          {status==="done"?"✓":status==="active"?"◎":"○"}
        </div>
      </div>
      <div style={{flex:1}}>
        <div className="syne" style={{fontSize:12,fontWeight:700,color:tc,transition:"color .3s"}}>{agent.label}</div>
        <div className="mono" style={{fontSize:10,color:status==="active"?"#8492B0":"#3A4255",marginTop:1}}>
          {status==="active"?agent.desc:status==="done"?"✓ Complete":"Standby"}
        </div>
      </div>
      {status==="active"&&<span className="mono" style={{fontSize:9,color:"#F5A623",animation:"blink .9s infinite",letterSpacing:".08em"}}>LIVE</span>}
      {status==="done"  &&<span className="mono" style={{fontSize:9,color:"#00D68F",letterSpacing:".08em"}}>DONE</span>}
    </div>
  );
}

function KpiRow({kpi,vis,delay}){
  const sc=kpi.score===null?"#5A6480":kpi.score>=80?"#00D68F":kpi.score>=60?"#FFBB33":"#FF4757";
  const circ=2*Math.PI*11;
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",
      background:kpi.hi?"rgba(245,166,35,.04)":"rgba(255,255,255,.01)",
      border:`1px solid ${kpi.hi?"rgba(245,166,35,.18)":"#1E2433"}`,borderRadius:6,
      opacity:vis?1:0,transform:vis?"translateX(0)":"translateX(-14px)",
      transition:`opacity .3s,transform .3s`,transitionDelay:`${delay}s`}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:10,fontWeight:500,color:kpi.hi?"#F5A623":"#C8D0E0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{kpi.l}</div>
        <div className="mono" style={{fontSize:8,color:"#5A6480",marginTop:1}}>{kpi.s}</div>
      </div>
      <div className="mono" style={{fontSize:11,fontWeight:700,color:kpi.hi?"#F5A623":"#E2E8F4",whiteSpace:"nowrap",flexShrink:0}}>{kpi.v}</div>
      {kpi.score!==null&&(
        <div style={{width:28,height:28,flexShrink:0,position:"relative"}}>
          <svg width="28" height="28" viewBox="0 0 28 28">
            <circle cx="14" cy="14" r="11" fill="none" stroke="#1E2433" strokeWidth="2.5"/>
            <circle cx="14" cy="14" r="11" fill="none" stroke={sc} strokeWidth="2.5"
              strokeDasharray={circ} strokeDashoffset={vis?circ-(circ*kpi.score/100):circ}
              strokeLinecap="round" transform="rotate(-90 14 14)"
              style={{transition:"stroke-dashoffset 1s ease",transitionDelay:`${delay+.25}s`}}/>
          </svg>
          <div style={{position:"absolute",top:0,right:0,bottom:0,left:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:6,fontWeight:700,color:sc,fontFamily:"monospace"}}>{kpi.score}</span>
          </div>
        </div>
      )}
    </div>
  );
}

function KpiSection({sec,vis,kvis}){
  return(
    <div style={{border:`1px solid ${sec.color}22`,borderRadius:9,overflow:"hidden",background:"rgba(255,255,255,.01)",
      opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(18px)",
      transition:"opacity .5s,transform .5s"}}>
      <div style={{padding:"10px 14px",borderBottom:`1px solid ${sec.color}22`,
        background:`linear-gradient(135deg,${sec.color}0D 0%,transparent 100%)`,
        display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:26,height:26,borderRadius:5,background:`${sec.color}18`,border:`1px solid ${sec.color}35`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:sec.color}}>{sec.icon}</div>
        <div style={{flex:1}}>
          <div className="syne" style={{fontSize:11,fontWeight:700,color:"#E2E8F4"}}>{sec.label}</div>
          <div className="mono" style={{fontSize:8,color:"#5A6480",marginTop:1}}>{sec.count} KPIs ANALYZED</div>
        </div>
        <div style={{padding:"2px 8px",borderRadius:10,background:`${sec.color}18`,border:`1px solid ${sec.color}35`}}>
          <span className="mono" style={{fontSize:8,color:sec.color,fontWeight:700,letterSpacing:".06em"}}>COMPLETE</span>
        </div>
      </div>
      <div style={{padding:"8px",display:"grid",gap:4}}>
        {sec.kpis.map((k,i)=><KpiRow key={i} kpi={k} vis={kvis} delay={i*.04}/>)}
      </div>
    </div>
  );
}

function OverallScore({vis}){
  const c=2*Math.PI*54;
  return(
    <div style={{padding:"20px",border:"1px solid rgba(245,166,35,.3)",borderRadius:11,
      background:"linear-gradient(135deg,rgba(245,166,35,.06) 0%,transparent 60%)",
      display:"flex",alignItems:"center",gap:20,flexWrap:"wrap",
      opacity:vis?1:0,transform:vis?"scale(1)":"scale(.92)",
      transition:"opacity .6s,transform .6s cubic-bezier(.34,1.56,.64,1)",
      animation:vis?"glow 3s ease infinite":"none"}}>
      <div style={{position:"relative",width:108,height:108,flexShrink:0}}>
        <svg width="108" height="108" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#1E2433" strokeWidth="7"/>
          <circle cx="60" cy="60" r="54" fill="none" stroke="#F5A623" strokeWidth="7"
            strokeDasharray={c} strokeDashoffset={vis?c-(c*.84):c}
            strokeLinecap="round" transform="rotate(-90 60 60)"
            style={{transition:"stroke-dashoffset 1.8s cubic-bezier(.4,0,.2,1)",transitionDelay:".2s",
              filter:"drop-shadow(0 0 8px rgba(245,166,35,.6))"}}/>
        </svg>
        <div style={{position:"absolute",top:0,right:0,bottom:0,left:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div className="syne" style={{fontSize:30,fontWeight:800,color:"#F5A623",lineHeight:1}}>84</div>
          <div className="mono" style={{fontSize:8,color:"#8492B0",marginTop:2}}>/ 100</div>
        </div>
      </div>
      <div style={{flex:1,minWidth:220}}>
        <div className="mono" style={{fontSize:9,color:"#F5A623",letterSpacing:".14em",textTransform:"uppercase",marginBottom:6}}>◉ OVERALL AUCTION SCORE</div>
        <div className="syne" style={{fontSize:22,fontWeight:800,color:"#00D68F",marginBottom:4}}>⭐ BIDWISE: STRONG BID</div>
        <div style={{fontSize:12,color:"#8492B0",lineHeight:1.65,marginBottom:12}}>
          2847 Harbor Blvd clears all critical KPI thresholds. Clean title chain, junior HOA lien, 107% bid/judgment ratio, strong coastal MTR demand. Max bid $213,000.
        </div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {[{l:"298",d:"KPIs Analyzed"},{l:"4",d:"Risk Flags"},{l:"94%",d:"Confidence"},{l:"#1",d:"Priority Bid"}].map(x=>(
            <div key={x.l} style={{padding:"5px 10px",background:"rgba(245,166,35,.08)",border:"1px solid rgba(245,166,35,.2)",borderRadius:6,textAlign:"center"}}>
              <div className="syne" style={{fontSize:14,fontWeight:800,color:"#F5A623"}}>{x.l}</div>
              <div className="mono" style={{fontSize:8,color:"#5A6480",marginTop:1}}>{x.d}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function PropCard({prop,highlightReport,index}){
  const t=TAG[prop.tag];
  const sc=prop.score>=75?"#00D68F":prop.score>=60?"#FFBB33":"#FF4757";
  return(
    <div style={{background:"#0F1117",border:`1px solid ${highlightReport?"rgba(245,166,35,.4)":"#1E2433"}`,
      borderRadius:9,padding:13,animation:`slide-up .4s ease both`,animationDelay:`${index*.1}s`,
      boxShadow:highlightReport?"0 0 18px rgba(245,166,35,.07)":"none",transition:"all .3s"}}>
      {highlightReport&&(
        <div className="mono" style={{fontSize:9,color:"#F5A623",letterSpacing:".1em",textTransform:"uppercase",marginBottom:7,display:"flex",alignItems:"center",gap:5}}>
          <span style={{animation:"blink 1s infinite"}}>●</span> GENERATING BIDWISE REPORT
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div className="syne" style={{fontSize:12,fontWeight:700,color:"#E2E8F4"}}>{prop.addr}</div>
          <div className="mono" style={{fontSize:9,color:"#5A6480",marginTop:2}}>{prop.city} · {prop.sqft.toLocaleString()} sqft · {prop.year}</div>
        </div>
        <div style={{padding:"3px 10px",borderRadius:18,fontSize:10,fontWeight:700,background:t.bg,border:`1px solid ${t.bd}`,color:t.tx,fontFamily:"Syne,sans-serif",letterSpacing:".06em",flexShrink:0}}>{prop.tag}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginTop:11}}>
        {[{l:"ARV",v:fmt(prop.arv),c:"#E2E8F4"},{l:"Max Bid",v:fmt(prop.maxBid),c:"#F5A623"},{l:"Judgment",v:fmt(prop.judgment),c:"#8492B0"}].map(x=>(
          <div key={x.l} style={{textAlign:"center"}}>
            <div className="mono" style={{fontSize:11,fontWeight:600,color:x.c}}>{x.v}</div>
            <div style={{fontSize:9,color:"#5A6480",marginTop:1,textTransform:"uppercase",letterSpacing:".05em"}}>{x.l}</div>
          </div>
        ))}
      </div>
      <div style={{height:2,background:"#161A24",borderRadius:1,overflow:"hidden",marginTop:9}}>
        <div style={{height:"100%",borderRadius:1,background:sc,width:`${prop.score}%`,transition:"width 1.2s ease"}}/>
      </div>
    </div>
  );
}

function Terminal({lines,active}){
  const ref=useRef();
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[lines]);
  return(
    <div ref={ref} style={{background:"#040608",border:"1px solid #1E2433",borderRadius:9,padding:14,height:180,overflowY:"hidden",position:"relative"}}>
      {active&&<div style={{position:"absolute",left:0,right:0,height:2,background:"linear-gradient(transparent,rgba(245,166,35,.15),transparent)",animation:"scanline 2s linear infinite",pointerEvents:"none"}}/>}
      {lines.map((line,i)=>{
        const tag=line.match(/^\[(\w+)\]/)?.[1];
        return(<div key={i} className="mono" style={{fontSize:11,lineHeight:1.85,animation:"data-in .2s ease both",animationDelay:`${i*.03}s`}}>
          <span style={{color:LC[tag]||"#5A6480"}}>{line.slice(0,line.indexOf("]")+1)}</span>
          <span style={{color:"#8492B0"}}>{line.slice(line.indexOf("]")+1)}</span>
        </div>);
      })}
      {active&&lines.length<12&&<span className="mono" style={{fontSize:11,color:"#F5A623",animation:"cursor-blink 1s infinite"}}>█</span>}
    </div>
  );
}

/* ─── APP ─────────────────────────────────────────────────────────── */
function App(){
  const[phase,setPhase]=useState("idle");
  const[typed,setTyped]=useState("");
  const[agt,setAgt]=useState({scraper:"idle",title:"idle",lien:"idle",ml:"idle",report:"idle"});
  const[logs,setLogs]=useState([]);
  const[stats,setStats]=useState(null);
  const[stv,setStv]=useState(false);
  const[props,setProps]=useState([]);
  const[tab,setTab]=useState("agents");
  const[rptSecs,setRptSecs]=useState(0);
  const[scoreVis,setScoreVis]=useState(false);
  const[rptDone,setRptDone]=useState(false);
  const[rptProp,setRptProp]=useState(false);
  const timers=useRef([]);
  const logRef=useRef([]);

  const kill=()=>{timers.current.forEach(clearTimeout);timers.current=[];};
  const after=(ms,fn)=>{const t=setTimeout(fn,ms);timers.current.push(t);};

  const run=useCallback(()=>{
    logRef.current=[];
    setTyped("");setLogs([]);setProps([]);setStats(null);setStv(false);
    setAgt({scraper:"idle",title:"idle",lien:"idle",ml:"idle",report:"idle"});
    setTab("agents");setPhase("typing");
    setRptSecs(0);setScoreVis(false);setRptDone(false);setRptProp(false);

    "Brevard".split("").forEach((ch,ci)=>after(ci*T.TD,()=>setTyped("Brevard".slice(0,ci+1))));
    const at="Brevard".length*T.TD+T.TP;

    after(at,()=>{
      setPhase("agents");setTab("agents");
      AGENTS.forEach(({id},ai)=>{
        after(ai*T.AG,     ()=>setAgt(s=>({...s,[id]:"active"})));
        after(ai*T.AG+T.AD,()=>setAgt(s=>({...s,[id]:"done"})));
      });
      LOGS.forEach((l,li)=>after(li*T.LI+200,()=>{logRef.current=[...logRef.current,l];setLogs([...logRef.current]);}));
      after(T.TL-at,()=>setTab("log"));
      after(T.SR-at,()=>{setStats({});after(200,()=>setStv(true));});
      after(T.RR-at,()=>{setProps(PROPS);setPhase("results");setTab("results");});
      after(T.CE-at,()=>setRptProp(true));
      after(T.CC-at,()=>setRptProp(false));
      // Report phase
      after(T.RPT_START-at,()=>{setTab("report");});
      after(T.RPT_K1-at,()=>setRptSecs(1));
      after(T.RPT_K2-at,()=>setRptSecs(2));
      after(T.RPT_K3-at,()=>setRptSecs(3));
      after(T.RPT_K4-at,()=>setRptSecs(4));
      after(T.RPT_SCORE-at,()=>setScoreVis(true));
      after(T.RPT_DONE-at,()=>setRptDone(true));
      after(T.LR-at,()=>{setPhase("idle");after(600,()=>run());});
    });
  },[]);

  useEffect(()=>{after(800,()=>run());return kill;},[]);

  const showPanel=phase==="agents"||phase==="results"||tab==="report"||rptSecs>0;

  return(
    <div style={{minHeight:"100vh",background:"#080A0D",color:"#E2E8F4",fontFamily:"'DM Sans',sans-serif",paddingBottom:80,userSelect:"none"}}>

      {/* NAV */}
      <div style={{borderBottom:"1px solid #1E2433",padding:"13px 22px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(8,10,13,.98)",position:"sticky",top:0,zIndex:100}}>
        <a href="https://zonewise.ai" style={{display:"flex",alignItems:"center",gap:10,textDecoration:"none"}}>
          <div style={{width:31,height:31,borderRadius:7,background:"#F5A623",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,boxShadow:"0 0 18px rgba(245,166,35,.4)"}}>⬡</div>
          <div>
            <div className="syne" style={{fontSize:15,fontWeight:800,letterSpacing:"-.02em",color:"#E2E8F4"}}>Zone<span style={{color:"#F5A623"}}>Wise</span><span style={{color:"#5A6480",fontWeight:400}}>.AI</span></div>
            <div className="mono" style={{fontSize:8,color:"#5A6480"}}>67 FL COUNTIES · BIDWISE 298-KPI</div>
          </div>
        </a>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {["Dashboard","Counties","Reports"].map(t=>(
            <div key={t} className="mono" style={{padding:"4px 10px",fontSize:10,color:"#3A4255"}}>{t}</div>
          ))}
          <a href="https://zonewise.ai" style={{padding:"6px 14px",borderRadius:6,background:"#F5A623",color:"#000",fontSize:11,fontWeight:700,textDecoration:"none",fontFamily:"Syne,sans-serif",letterSpacing:".04em"}}>Join Waitlist →</a>
        </div>
      </div>

      <div style={{maxWidth:940,margin:"0 auto",padding:"34px 18px 0"}}>

        {/* HERO */}
        {phase==="idle"&&(
          <div style={{textAlign:"center",marginBottom:32,animation:"fade-in .5s ease"}}>
            <div className="mono" style={{fontSize:10,color:"#F5A623",letterSpacing:".18em",textTransform:"uppercase",marginBottom:10}}>◉ AUTONOMOUS DEMO — LIVE</div>
            <h1 className="syne" style={{fontSize:"clamp(24px,4.5vw,50px)",fontWeight:800,lineHeight:1.06,letterSpacing:"-.03em",marginBottom:12}}>
              Every Florida auction.<br/><span style={{color:"#F5A623"}}>BidWise. 298 KPIs. In seconds.</span>
            </h1>
            <p style={{fontSize:14,color:"#8492B0",maxWidth:480,margin:"0 auto",lineHeight:1.72}}>
              12 Wise modules — DiscoverWise, TitleWise, LienWise, ScoreWise — deliver a full 298-KPI BidWise report. Autonomous. No analyst needed.
            </p>
          </div>
        )}

        {/* SEARCH BAR */}
        <div style={{maxWidth:520,margin:"0 auto",marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",background:"#0F1117",
            border:`1px solid ${phase!=="idle"?"rgba(245,166,35,.7)":"#2A3145"}`,
            borderRadius:10,overflow:"hidden",transition:"border-color .4s,box-shadow .4s",
            boxShadow:phase!=="idle"?"0 0 28px rgba(245,166,35,.10)":"none"}}>
            <div style={{padding:"0 13px",color:"#5A6480",display:"flex"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <div style={{flex:1,padding:"13px 0",display:"flex",alignItems:"center"}}>
              <span style={{fontSize:13,color:typed?"#E2E8F4":"#3A4255",fontFamily:"'DM Sans',sans-serif"}}>
                {typed||(phase==="idle"?"Searching Florida counties...":"")}
              </span>
              {phase==="typing"&&<span style={{display:"inline-block",width:2,height:14,background:"#F5A623",marginLeft:2,animation:"cursor-blink .9s infinite"}}/>}
            </div>
            <div style={{padding:"10px 18px",background:"#F5A623",color:"#000",fontWeight:700,fontSize:11,fontFamily:"Syne,sans-serif",letterSpacing:".04em",
              opacity:phase==="typing"?.5:1,transition:"opacity .3s",display:"flex",alignItems:"center",gap:5}}>
              {phase==="agents"||phase==="results"||tab==="report"
                ?<><span style={{width:6,height:6,borderRadius:"50%",background:"#000",display:"inline-block",animation:"blink .7s infinite"}}/> RUNNING</>
                :"ANALYZE →"}
            </div>
          </div>
        </div>

        {/* IDLE PILLS */}
        {phase==="idle"&&(
          <div style={{display:"flex",justifyContent:"center",gap:10,flexWrap:"wrap",animation:"slide-up .6s ease"}}>
            {[{v:"67",l:"FL Counties"},{v:"298",l:"KPIs / Property"},{v:"5",l:"AI Agents"},{v:"< 60s",l:"Full Report"}].map(x=>(
              <div key={x.l} style={{padding:"9px 17px",background:"#0F1117",border:"1px solid #1E2433",borderRadius:40,display:"flex",alignItems:"center",gap:8}}>
                <span className="syne" style={{fontSize:16,fontWeight:800,color:"#F5A623"}}>{x.v}</span>
                <span style={{fontSize:11,color:"#5A6480"}}>{x.l}</span>
              </div>
            ))}
          </div>
        )}

        {/* ACTIVE PANEL */}
        {showPanel&&(
          <div>
            {/* Stats */}
            {stats&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:1,background:"#1E2433",borderRadius:9,overflow:"hidden",marginBottom:14}}>
                {[{l:"Total",v:19,c:"#E2E8F4"},{l:"BID",v:4,c:"#00D68F"},{l:"REVIEW",v:3,c:"#FFBB33"},{l:"SKIP",v:12,c:"#FF4757"},{l:"Judgment",v:"$4.4M",c:"#8492B0"}].map(x=>(
                  <div key={x.l} style={{background:"#0F1117",padding:"11px 8px",textAlign:"center"}}>
                    <div className="syne" style={{fontSize:19,fontWeight:800,color:x.c,opacity:stv?1:0,transform:stv?"scale(1)":"scale(.7)",transition:"all .5s cubic-bezier(.34,1.56,.64,1)"}}>{x.v}</div>
                    <div className="mono" style={{fontSize:8,color:"#5A6480",marginTop:2,textTransform:"uppercase",letterSpacing:".1em"}}>{x.l}</div>
                  </div>
                ))}
              </div>
            )}

            {/* Tab bar */}
            <div style={{display:"flex",gap:4,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
              {["agents","log","results","report"].map(t=>(
                <div key={t} className="syne" style={{padding:"5px 14px",borderRadius:5,fontSize:10,fontWeight:700,
                  letterSpacing:".06em",textTransform:"uppercase",position:"relative",
                  background:tab===t?"#F5A623":"#0F1117",color:tab===t?"#000":"#3A4255",
                  border:tab===t?"none":"1px solid #1E2433",transition:"all .3s"}}>
                  {t}
                  {t==="report"&&tab!=="report"&&rptSecs>0&&(
                    <span style={{position:"absolute",top:-3,right:-3,width:7,height:7,borderRadius:"50%",background:"#F5A623",animation:"blink .8s infinite"}}/>
                  )}
                </div>
              ))}
              <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:6,height:6,borderRadius:"50%",
                  background:rptDone?"#00D68F":tab==="report"?"#F5A623":phase==="results"?"#00D68F":"#F5A623",
                  animation:phase==="agents"||tab==="report"&&!rptDone?"blink .7s infinite":"none"}}/>
                <span className="mono" style={{fontSize:9,
                  color:rptDone?"#00D68F":tab==="report"?"#F5A623":phase==="results"?"#00D68F":"#F5A623"}}>
                  {rptDone?"BIDWISE COMPLETE":tab==="report"?"GENERATING BIDWISE REPORT":phase==="results"?"ANALYSIS COMPLETE":"ANALYZING BREVARD"}
                </span>
              </div>
            </div>

            {tab==="agents"&&<div style={{display:"grid",gap:7,animation:"fade-in .3s ease"}}>{AGENTS.map(a=><AgentNode key={a.id} agent={a} status={agt[a.id]}/>)}</div>}
            {tab==="log"&&<Terminal lines={logs} active={phase==="agents"}/>}
            {tab==="results"&&(
              <div style={{display:"grid",gap:7,animation:"fade-in .3s ease"}}>
                {props.map((p,i)=><PropCard key={i} prop={p} highlightReport={i===0&&rptProp} index={i}/>)}
                <div className="mono" style={{fontSize:9,color:"#3A4255",textAlign:"center",marginTop:6}}>
                  Showing 4 of 19 · 4 BID · 3 REVIEW · 12 SKIP
                </div>
              </div>
            )}
            {tab==="report"&&(
              <div style={{overflowY:"auto",maxHeight:"68vh",paddingRight:3}}>
                <ReportView sections={rptSecs} scoreVis={scoreVis} done={rptDone}/>
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{textAlign:"center",marginTop:44,paddingBottom:16}}>
        <div className="mono" style={{fontSize:8,color:"#2A3145",letterSpacing:".14em"}}>
          ZONEWISE.AI · 298-KPI AGENTIC INTELLIGENCE · FLORIDA FORECLOSURE · Q1 2026
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
