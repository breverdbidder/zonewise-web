<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="60%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="heat1" cx="65%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat2" cx="40%" cy="45%" r="25%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat3" cx="55%" cy="70%" r="20%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#F59E0B" opacity="0.06"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="70%" stop-color="#020617" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#heat1)"/>
  <rect width="1920" height="1080" fill="url(#heat2)"/>
  <rect width="1920" height="1080" fill="url(#heat3)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
